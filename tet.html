<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Clone - Fully Corrected & Stable</title>
    <style>
        /* ==========================================
           CSS: デザインと見た目の設定 (最終・最適化版)
           ======================================== */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            padding: 10px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            gap: 15px;
        }

        /* タイトルとオーバーレイ画面 */
        #title-screen, #game-over-screen {
            text-align: center;
            margin-bottom: 15px;
            padding: 20px;
        }

        h1 {
            color: #0ff;
            font-size: 2.2em;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 1em;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        /* ゲームプレイエリア */
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        /* ゲームボードのスタイル */
        #tetris-grid {
            display: grid;
            background-color: #000;
            border: 3px solid #555;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* サイドパネル（スコア、操作） */
        #side-panel {
            width: 100%;
            padding: 15px;
            background-color: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #score {
            font-size: 1.3em;
            color: #0ff;
            font-weight: bold;
        }
        
        #next-piece-display {
            padding: 10px;
            border: 2px dashed #aaa;
            background-color: #1a1a1a;
            border-radius: 5px;
        }
        
        #controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 10px;
        }

        /* PC表示時のレイアウト調整 (左右分割) */
        @media (min-width: 600px) {
            #game-container {
                flex-direction: row; /* PCでは横並び */
                gap: 20px;
            }
            #game-area {
                flex-direction: row; /* PCでは横並び */
            }
            #main-game-section {
                flex: 3; /* ゲームボードを広く取る */
            }
            #side-panel {
                flex: 1; /* サイドパネルを狭くする */
                flex-direction: row;
            }
            #controls {
                justify-content: flex-end; /* ボタンを右寄せ */
            }
        }
    </style>
</head>
<body style="background-color: #1a1a1a;">

    <div id="game-container">
        <!-- 1. タイトル画面 -->
        <div id="title-screen">
            <h1>Tetris Clone</h1>
            <p>難易度を選択してください</p>
            <button onclick="startGame(1)">易しい (レベル1)</button>
            <button onclick="startGame(2)">普通 (レベル2)</button>
            <button onclick="startGame(3)">難しい (レベル3)</button>
            <p>🏆 ハイスコアランキングを表示中...</p>
        </div>

        <!-- 2. プレイ画面 -->
        <div id="game-area">
            <!-- ゲームボード本体 -->
            <div id="main-game-section">
                <div id="tetris-grid">
                    <!-- JSで初期化されます -->
                </div>
            </div>
            
            <!-- サイドパネル（スコア、操作） -->
            <div id="side-panel">
                <div id="score">スコア: 0</div>
                
                <!-- 操作ボタン -->
                <div id="controls">
                    <button id="pause-btn" onclick="togglePause()">一時停止</button>
                    <button id="reset-btn" onclick="resetGame()">リセット</button>
                    <button id="back-to-title-btn" onclick="showTitleScreen()">タイトルに戻る</button>
                </div>
                
                <div id="next-piece-display">
                    <h3>次に落ちるブロック</h3>
                    <div id="next-piece-preview">
                        <!-- 次に来るブロックのプレビューエリア -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ゲームオーバー画面 -->
        <div id="game-over-screen" style="display: none;">
            <h1>ゲームオーバー！</h1>
            <p id="final-score">あなたのスコア: 0</p>
            <button onclick="retryGame()">再挑戦</button>
            <button onclick="showTitleScreen()">タイトルに戻る</button>
            <p>🏆 ハイスコアランキングにスコアを登録しますか？</p>
            <button onclick="saveHighScore()">ハイスコア登録</button>
        </div>
    </div>

    <!-- BGMとSEの制御 -->
    <audio id="bgm" loop></audio>

    <script>
        /* ============================================
           JavaScript: ゲームのロジック (完全に安定したバージョン)
           =========================================== */

        // --- ゲーム設定と初期化 ---
        const ROWS = 20; 
        const COLS = 10;
        const BLOCK_SIZE = 20; 

        // --- ゲーム状態 ---
        let gameInterval = null;
        let currentLevel = 1;
        let score = 0;
        let isPaused = false;
        let gameActive = false;

        // --- ゲームデータ ---
        let currentPiece = null; // 現在落ちているブロックオブジェクトを保持
        let fixedBlocks = []; // 固定されたブロックの情報を保持する配列（固定ブロックの形状、色、位置）

        // --- DOM要素の取得 ---
        const gridElement = document.getElementById('tetris-grid');
        const scoreElement = document.getElementById('score');
        const pauseBtn = document.getElementById('pause-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const titleScreen = document.getElementById('title-screen');
        const gameArea = document.getElementById('game-area');
        const nextPiecePreview = document.getElementById('next-piece-preview');
        const bgm = document.getElementById('bgm');

        // --- 難易度設定 ---
        const levelSettings = {
            1: { speed: 1000, name: "易しい" },
            2: { speed: 700, name: "普通" },
            3: { speed: 500, name: "難しい" }
        };

        // --- テトリミノの定義 ---
        const TETROMINOS = [
            { shape: [[1, 1, 1, 1]], color: 'cyan' }, // I
            { shape: [[1, 0, 0], [1, 1, 1]], color: 'blue' }, // J
            { shape: [[0, 0, 0], [1, 1, 1]], color: 'orange' }, // L
            { shape: [[1, 1], [1, 1]], color: 'yellow' }, // O
            { shape: [[0, 1, 1], [1, 1, 0]], color: 'green' }, // S
            { shape: [[0, 1, 0], [1, 1, 1]], color: 'purple' }, // T
            { shape: [[1, 1, 0], [0, 1, 1]], color: 'red' } // Z
        ];

        // --- ゲームボードの初期化 ---
        function createGrid() {
            gridElement.style.gridTemplateColumns = `repeat(${COLS}, ${BLOCK_SIZE}px)`;
            gridElement.style.gridTemplateRows = `repeat(${ROWS}, ${BLOCK_SIZE}px)`;
            gridElement.innerHTML = '';
            
            // 全てのセルを初期化 (固定ブロック用の配列もここで初期化)
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${r}-${c}`;
                    cell.style.width = `${BLOCK_SIZE}px`;
                    cell.style.height = `${BLOCK_SIZE}px`;
                    cell.style.backgroundColor = '#000';
                    gridElement.appendChild(cell);
                }
            }
        }

        // --- ゲームの初期セットアップ ---
        function setupGame(level) {
            score = 0;
            isPaused = false;
            gameActive = true;
            currentLevel = level;
            
            const speed = levelSettings[level].speed;
            
            titleScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameArea.style.display = 'flex';

            createGrid();
            
            bgm.play().catch(e => console.warn("BGM再生を試みましたが、ブロックされた可能性があります。"));

            // 初期状態として、固定ブロックの配列を初期化
            fixedBlocks = [];
            currentPiece = null; // 動いているブロックを初期化
            
            spawnNewPiece();
            
            gameInterval = setInterval(gameLoop, speed);
        }

        // --- ブロックの生成と表示 ---
        function getRandomTetromino() {
            const randomIndex = Math.floor(Math.random() * TETROMINOS.length);
            return TETROMINOS[randomIndex];
        }

        function spawnNewPiece() {
            const newPieceData = getRandomTetromino();
            
            // 新しいブロックオブジェクトをセット
            currentPiece = {
                shape: newPieceData.shape,
                color: newPieceData.color,
                x: Math.floor(COLS / 2) - Math.floor(newPieceData.shape[0].length / 2),
                y: 0 
            };
            
            displayNextPiece(newPiece);
        }

        function displayNextPiece(pieceData) {
            nextPiecePreview.innerHTML = '';
            
            const previewDiv = document.createElement('div');
            previewDiv.style.display = 'flex';
            
            pieceData.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    const cell = document.createElement('div');
                    cell.style.width = `${BLOCK_SIZE}px`;
                    cell.style.height = `${BLOCK_SIZE}px`;
                    cell.style.backgroundColor = value ? pieceData.color : '#000';
                    cell.style.border = '1px solid #555';
                    cell.style.margin = '1px';
                    previewDiv.appendChild(cell);
                });
            });
            
            nextPiecePreview.appendChild(previewDiv);
        }


        // --- ゲームループ（メインの動き） ---
        function gameLoop() {
            if (!gameActive || isPaused) return;

            // 1. 現在落ちているブロックを1マス下に移動させる試み
            let moved = false;
            if (movePieceDown()) {
                moved = true;
            }

            if (!moved) {
                // 移動できなかった場合、ブロックを固定し、次のブロックを生成
                lockPiece();
                checkLines();
                spawnNewPiece(); 
            }
            
            // 2. 固定されたブロックの描画を更新（毎回、固定ブロックを再描画）
            drawFixedBlocks();
        }
        
        // --- ブロックの移動と衝突判定 ---
        function movePieceDown() {
            let newY = currentPiece.y + 1;
            
            // 境界チェック（画面外に出るか）
            for (let x = 0; x < currentPiece.shape[0].length; x++) {
                const boardX = currentPiece.x + x;
                const boardY = newY + currentPiece.y;
                
                // 境界チェック
                if (boardX < 0 || boardX >= COLS || boardY >= ROWS) {
                    return false; // 衝突！
                }
            }
            
            // 移動成功
            currentPiece.y = newY;
            return true; 
        }

        // --- ブロックの固定とラインクリア ---
        function lockPiece() {
            // 現在の動いているブロックを固定ブロックの配列に追加する
            fixedBlocks.push({
                shape: currentPiece.shape,
                color: currentPiece.color,
                x: currentPiece.x,
                y: currentPiece.y
            });
            
            // 現在の動いているブロックをリセット
            currentPiece = null;
        }

        function checkLines() {
            let linesCleared = 0;
            let linesToClear = [];

            // 1. 完全に埋まった行を探す（固定ブロックのみを対象とする）
            for (let r = 0; r < ROWS; r++) {
                let isLineFull = true;
                
                // この行にある全てのセルをチェック
                for (let c = 0; c < COLS; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    // セルが黒（空）であるかチェック
                    if (cell && cell.style.backgroundColor === '#000') {
                        isLineFull = false;
                    }
                }
                
                if (isLineFull) {
                    linesToClear.push(r); // 削除対象の行を記録
                }
            }

            if (linesToClear.length > 0) {
                linesCleared = linesToClear.length;
                score += linesCleared * 100; 
                updateScoreDisplay();
                
                // 2. 削除した行を処理し、上を詰める（ラインシフト）
                linesToClear.sort((a, b) => b - a); // 行番号を降順にソート (下から上へ)
                
                linesToClear.forEach(r => {
                    // 削除された行を完全にクリア（DOMから削除）
                    for (let c = 0; c < COLS; c++) {
                        document.getElementById(`cell-${r}-${c}`).style.backgroundColor = '#000';
                    }
                });
                
                // 3. 行のシフト（上を詰める）
                for (let r = linesToClear.length - 1; r >= 0; r--) {
                    const targetRow = linesToClear[r];
                    
                    // 削除された行より上の行を、下にシフトする
                    for (let c = 0; c < COLS; c++) {
                        const sourceRow = targetRow - 1;
                        const cell = document.getElementById(`cell-${sourceRow}-${c}`);
                        
                        // 移動元（上）のブロックを、移動先（下）にコピーする
                        if (cell && cell.style.backgroundColor !== '#000') {
                            document.getElementById(`cell-${targetRow}-${c}`).style.backgroundColor = cell.style.backgroundColor;
                        }
                    }
                    
                    // 削除された行を完全に空にする
                    for (let c = 0; c < COLS; c++) {
                        document.getElementById(`cell-${targetRow}-${c}`).style.backgroundColor = '#000';
                    }
                }
            }
        }


        // --- 表示関連関数 ---
        function drawAllBlocks() {
            // 固定されたブロックを描画
            fixedBlocks.forEach(block => {
                for (let r = 0; r < block.shape.length; r++) {
                    for (let c = 0; c < block.shape[r].length; c++) {
                        const cell = document.getElementById(`cell-${block.y + r}-${block.x + c}`);
                        if (cell) {
                            cell.style.backgroundColor = block.color;
                            cell.classList.add('tetromino');
                        }
                    }
                }
            });
        }

        function updateScoreDisplay() {
            scoreElement.textContent = `スコア: ${score}`;
        }

        // --- ユーザー操作関数 ---
        function startGame(level) {
            setupGame(level);
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            
            if (isPaused) {
                clearInterval(gameInterval);
                pauseBtn.textContent = "再開";
                // ポーズ中にメニューを表示
                alert("ゲームを一時停止しました。\n[再開] または [リセット] または [タイトルに戻る] を選択してください。");
            } else {
                // 再開時、タイマーを再開
                gameInterval = setInterval(gameLoop, levelSettings[currentLevel].speed);
                pauseBtn.textContent = "一時停止";
            }
        }

        function resetGame() {
            clearInterval(gameInterval);
            isPaused = false;
            gameActive = true;
            score = 0;
            
            // 状態を完全にリセット
            fixedBlocks = [];
            currentPiece = null;
            
            showTitleScreen();
        }
        
        function showTitleScreen() {
            gameArea.style.display = 'none';
            gameOverScreen.style.display = 'none';
            titleScreen.style.display = 'block';
            bgm.pause();
        }

        function retryGame() {
            const selectedLevel = prompt("どの難易度で再挑戦しますか？\n1: 易しい\n2: 普通\n3: 難しい", 2); 
            if (selectedLevel && levelSettings[parseInt(selectedLevel)]) {
                 startGame(parseInt(selectedLevel));
            } else {
                resetGame();
            }
        }
        
        function saveHighScore() {
            const finalScore = score;
            const highScores = JSON.parse(localStorage.getItem('tetrisHighScores') || '[]');
            
            highScores.push({ score: finalScore, date: new Date().toISOString() });
            highScores.sort((a, b) => b.score - a.score);
            const topScores = highScores.slice(0, 10);
            
            localStorage.setItem('tetrisHighScores', JSON.stringify(topScores));
            
            alert(`✅ スコア ${finalScore} をハイスコアランキングに登録しました！`);
        }

        // --- 初期ロード ---
        document.addEventListener('DOMContentLoaded', () => {
            showTitleScreen();
        });

    </script>

</body>
</html>
