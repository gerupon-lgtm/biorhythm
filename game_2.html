<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🕹️ ZELBIUS METALLIC: BOSS OVERHAUL 🕹️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            user-select: none;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 480px;
            border: 4px solid #444;
            box-shadow: 0 0 30px #00ff00;
            background-color: #000011;
        }
        canvas { display: block; }
        #ui-overlay {
            width: 480px;
            padding: 10px 0;
            background-color: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
        }
        #control-guide {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(0, 30, 0, 0.7);
            width: 450px;
            text-align: left;
            border: 1px dashed #00ff00;
            font-size: 13px;
            line-height: 1.4;
        }
        .gauge-container { width: 100px; height: 10px; border: 1px solid #00ff00; display: inline-block; vertical-align: middle; }
        #special-gauge { width: 0%; height: 100%; background: #0ff; transition: width 0.2s; }
    </style>
</head>
<body oncontextmenu="event.preventDefault()">

    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="700"></canvas>
    </div>

    <div id="ui-overlay">
        <div id="score-display">SCORE: 0</div>
        <div id="stage-display">STAGE: 1</div>
        <div id="hp-display">HP: 3</div>
        <div>SP: <div class="gauge-container"><div id="special-gauge"></div></div></div>
    </div>

    <div id="control-guide">
        <strong>▶️ 操作方法 ◀️</strong><br>
        ・移動: 矢印キー / WASD / ドラッグ | 攻撃: スペース / タップ<br>
        ・<strong>特殊攻撃: Xキー / ダブルタップ</strong> (ゲージMAX)<br>
        ・ショット制限: 2発ごとに短いリロードが発生します
    </div>

    <script>
        // ====================================================
        // 🔈 サウンドエンジン
        // ====================================================
        let audioCtx = null;
        let melodyIdx = 0, bassIdx = 0;
        const MELODY_DATA = [220, 246.9, 261.6, 293.6, 329.6, 293.6, 261.6, 246.9, 220, 196.0, 174.6, 196.0, 220, 246.9, 261.6, 293.6];
        const BASS_DATA = [55, 55, 65, 65, 55, 55, 73, 73];

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playBGMStep() {
            if (!audioCtx || gameState !== 'PLAYING') return;
            const mOsc = audioCtx.createOscillator();
            const mGain = audioCtx.createGain();
            mOsc.type = 'square';
            mOsc.frequency.setValueAtTime(MELODY_DATA[melodyIdx], audioCtx.currentTime);
            mGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            mGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            mOsc.connect(mGain); mGain.connect(audioCtx.destination);
            mOsc.start(); mOsc.stop(audioCtx.currentTime + 0.2);
            melodyIdx = (melodyIdx + 1) % MELODY_DATA.length;
            if (frameCount % 50 === 0) {
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'triangle';
                bOsc.frequency.setValueAtTime(BASS_DATA[bassIdx], audioCtx.currentTime);
                bGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                bGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                bOsc.connect(bGain); bGain.connect(audioCtx.destination);
                bOsc.start(); bOsc.stop(audioCtx.currentTime + 0.4);
                bassIdx = (bassIdx + 1) % BASS_DATA.length;
            }
        }
        function playSE(freq, type, duration, volume = 0.2) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // ====================================================
        // ⚙️ ゲームエンジン
        // ====================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisp = document.getElementById('score-display');
        const stageDisp = document.getElementById('stage-display');
        const hpDisp = document.getElementById('hp-display');
        const spGauge = document.getElementById('special-gauge');

        let gameState = 'TITLE', score = 0, stage = 1, hp = 3, frameCount = 0;
        let bullets = [], enemyBullets = [], enemies = [], items = [], particles = [];
        let keys = {}, stars = [], hitFlash = 0;
        let powerLevel = 1, speedLevel = 1, specialCharge = 0;
        let boss = null;
        let shakeIntensity = 0;
        let shotCount = 0; // 連射制限用
        let shotReloadTimer = 0;

        const MAX_POWER = 3, MAX_SPEED = 3, INITIAL_PLAYER_SPEED = 3; // 初期速度をさらに低下
        for(let i=0; i<60; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*3 + 1});

        function createExplosion(x, y, color, count = 10) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                    life: 20 + Math.random() * 20, color: color, size: Math.random() * 3 + 1
                });
            }
        }

        function drawMetallicShape(x, y, w, h, color1, color2) {
            let grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, color1); grad.addColorStop(0.5, color2); grad.addColorStop(1, color1);
            ctx.fillStyle = grad; ctx.fillRect(x, y, w, h);
        }

        const player = {
            x: 220, y: 600, w: 40, h: 40,
            reset() { this.x = 220; this.y = 600; },
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                drawMetallicShape(0, 15, 40, 10, '#006600', '#00ff00');
                drawMetallicShape(15, 0, 10, 40, '#004400', '#ffffff');
                ctx.fillStyle = '#88ccff';
                ctx.beginPath(); ctx.arc(20, 15, 5, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        };

        class Enemy {
            constructor(type, isBoss = false) {
                this.isBoss = isBoss; this.type = type;
                this.w = isBoss ? 180 : 40; this.h = isBoss ? 120 : 40;
                this.x = isBoss ? canvas.width/2 - 90 : Math.random() * (canvas.width - 40);
                this.y = isBoss ? -200 : -50;
                this.hp = isBoss ? 150 * stage : (type === 'H' ? 3 : 1) * Math.ceil(stage/2);
                this.maxHp = this.hp;
                this.color1 = type === 'B' ? '#aa8800' : (type === 'H' ? '#aa4400' : '#660066');
                this.color2 = type === 'B' ? '#ffff00' : (type === 'H' ? '#ffaa00' : '#ff00ff');
                if(isBoss) { this.color1 = '#330000'; this.color2 = '#ff0000'; }
                this.speed = (type === 'H' ? 2 : 4) + (stage * 0.6);
                this.shootTimer = Math.random() * 100;
            }
            update() {
                if(this.isBoss) {
                    this.y = Math.min(this.y + 1.5, 80);
                    this.x += Math.sin(frameCount/60) * 3;
                    this.shootTimer++;
                    // ボスの攻撃パターン
                    if(this.shootTimer > 80) {
                        // 扇状弾幕
                        for(let i=-4; i<=4; i++) {
                            enemyBullets.push({x: this.x + this.w/2, y: this.y + this.h, w: 12, h: 15, vx: i*0.8, vy: 6});
                        }
                        this.shootTimer = 0;
                    }
                } else {
                    this.y += this.speed;
                    if(this.type === 'S') this.x += Math.sin(frameCount/20)*4;
                    if(this.type === 'H') { if(this.x < player.x) this.x += 1.5; else this.x -= 1.5; }
                    if(this.type === 'S' || this.type === 'A') {
                        this.shootTimer++;
                        if(this.shootTimer > 120 - (stage * 5)) {
                            enemyBullets.push({x: this.x + this.w/2, y: this.y + this.h, w: 6, h: 10, vx: 0, vy: 8 + stage});
                            this.shootTimer = 0;
                        }
                    }
                }
            }
            draw() {
                ctx.save();
                if(this.isBoss) {
                    // ボスの凝ったデザイン: 巨大な装甲とコア
                    drawMetallicShape(this.x, this.y, this.w, 40, this.color1, this.color2); // 上部装甲
                    drawMetallicShape(this.x+30, this.y+40, this.w-60, 60, this.color1, this.color2); // 中央ボディ
                    ctx.fillStyle = '#ffaa00';
                    ctx.beginPath(); ctx.arc(this.x + this.w/2, this.y + 60, 25, 0, Math.PI*2); ctx.fill(); // コア
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                } else {
                    drawMetallicShape(this.x, this.y + 10, this.w, 20, this.color1, this.color2);
                    drawMetallicShape(this.x + 15, this.y, 10, 40, this.color1, this.color2);
                }
                ctx.fillStyle = '#444'; ctx.fillRect(this.x, this.y-15, this.w, 5);
                ctx.fillStyle = 'lime'; ctx.fillRect(this.x, this.y-15, (this.hp/this.maxHp)*this.w, 5);
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type) { this.x = x; this.y = y; this.w = 24; this.h = 24; this.type = type; }
            update() { this.y += 2; }
            draw() {
                ctx.fillStyle = this.type === 'P' ? '#0ff' : '#f0f';
                ctx.beginPath(); ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(this.type, this.x+12, this.y+17);
            }
        }

        // ====================================================
        // 🕹️ 操作・制御
        // ====================================================
        let lastTouchTime = 0;
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(e.key === 'Enter' && (gameState === 'TITLE' || gameState === 'GAMEOVER')) startGame();
            if(e.key === 'p' || e.key === 'P') {
                if(gameState === 'PLAYING') gameState = 'PAUSED'; else if(gameState === 'PAUSED') gameState = 'PLAYING';
            }
            if(e.key === 'r' || e.key === 'R') { if(gameState === 'PAUSED') gameState = 'TITLE'; }
            if(e.key === 'x' || e.key === 'X') triggerSpecial();
            if(e.key === ' ') { e.preventDefault(); fire(); }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if(gameState !== 'PLAYING') { if(gameState==='TITLE'||gameState==='GAMEOVER') startGame(); return; }
            const now = Date.now();
            if(now - lastTouchTime < 300) { triggerSpecial(); } else { fire(); }
            lastTouchTime = now;
        }, {passive: false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            player.x = touch.clientX - rect.left - player.w/2;
        }, {passive: false});

        function fire() {
            if(gameState !== 'PLAYING') return;
            if(shotReloadTimer > 0) return; // リロード中

            // ショット発射
            if(powerLevel === 1) bullets.push({x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12});
            else if(powerLevel === 2) {
                bullets.push({x: player.x + 10, y: player.y, w: 4, h: 12});
                bullets.push({x: player.x + player.w - 14, y: player.y, w: 4, h: 12});
            } else {
                bullets.push({x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12});
                bullets.push({x: player.x, y: player.y + 10, w: 4, h: 12});
                bullets.push({x: player.x + player.w - 4, y: player.y + 10, w: 4, h: 12});
            }
            playSE(800, 'sawtooth', 0.1);
            
            shotCount++;
            if(shotCount >= 2) {
                shotCount = 0;
                shotReloadTimer = 15; // 15フレームのリロード
            }
        }

        function triggerSpecial() {
            if(gameState !== 'PLAYING' || specialCharge < 100) return;
            specialCharge = 0;
            playSE(200, 'square', 0.6, 0.4);
            enemies.forEach(e => { e.hp -= 40; });
            shakeIntensity = 20;
            hitFlash = 30;
        }

        function startGame() {
            initAudio();
            score = 0; stage = 1; hp = 3; bullets = []; enemyBullets = []; enemies = []; items = [];
            powerLevel = 1; speedLevel = 1; specialCharge = 0;
            boss = null; shotCount = 0; shotReloadTimer = 0;
            player.reset();
            gameState = 'PLAYING';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            shakeIntensity = 20;
            playSE(100, 'sawtooth', 0.8, 0.4);
        }

        // ====================================================
        // 🔄 メインループ
        // ====================================================
        function update() {
            if(gameState !== 'PLAYING') return;
            frameCount++;
            if(frameCount % 25 === 0) playBGMStep();
            if(shotReloadTimer > 0) shotReloadTimer--;

            shakeIntensity *= 0.9;

            stars.forEach(s => {
                s.y += s.s * (2 + stage);
                if(s.y > canvas.height) s.y = 0;
            });

            const currentSpeed = INITIAL_PLAYER_SPEED + (speedLevel * 3);
            if(keys['arrowleft'] || keys['a']) player.x -= currentSpeed;
            if(keys['arrowright'] || keys['d']) player.x += currentSpeed;
            if(keys['arrowup'] || keys['w']) player.y -= currentSpeed;
            if(keys['arrowdown'] || keys['s']) player.y += currentSpeed;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

            bullets.forEach((b, i) => {
                b.y -= 15;
                if(b.y < 0) bullets.splice(i, 1);
            });

            enemyBullets.forEach((eb, i) => {
                eb.y += eb.vy || 7;
                eb.x += eb.vx || 0;
                if(eb.y > canvas.height) enemyBullets.splice(i, 1);
                if(player.x < eb.x + eb.w && player.x + player.w > eb.x && player.y < eb.y + eb.h && player.y + player.h > eb.y) {
                    hp--; enemyBullets.splice(i, 1); 
                    hitFlash = 10; shakeIntensity = 15;
                    powerLevel = 1; speedLevel = 1;
                    createExplosion(player.x + player.w/2, player.y + player.h/2, '#ff0', 15);
                    playSE(150, 'sawtooth', 0.3);
                    if(hp <= 0) gameOver();
                }
            });

            if(!boss) {
                const spawnRate = Math.max(20, 60 - (stage * 5));
                if(frameCount % spawnRate === 0 && score < stage * 500) {
                    const types = ['B', 'H', 'S', 'A'];
                    enemies.push(new Enemy(types[Math.floor(Math.random()*4)]));
                }
                if(score >= stage * 500) {
                    boss = new Enemy('BOSS', true);
                    enemies.push(boss);
                    playSE(200, 'square', 1.0, 0.5);
                    shakeIntensity = 20;
                }
            }

            if(score > stage * 1000) {
                stage++; boss = null;
                playSE(600, 'square', 0.3);
            }

            enemies.forEach((e, i) => {
                e.update();
                if(e.y > canvas.height) enemies.splice(i, 1);
                if(player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                    hp--; enemies.splice(i, 1); hitFlash = 10; shakeIntensity = 15;
                    powerLevel = 1; speedLevel = 1;
                    createExplosion(e.x + e.w/2, e.y + e.h/2, e.color2, 15);
                    playSE(150, 'sawtooth', 0.3);
                    if(hp <= 0) gameOver();
                }
                bullets.forEach((b, bi) => {
                    if(b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        e.hp--; bullets.splice(bi, 1);
                        if(e.hp <= 0) {
                            if(!e.isBoss && Math.random() < 0.15) items.push(new Item(e.x, e.y, Math.random() < 0.5 ? 'P' : 'S'));
                            if(e.isBoss) { score += 500; boss = null; } else { score += 10; }
                            createExplosion(e.x + e.w/2, e.y + e.h/2, e.color2, 12);
                            enemies.splice(i, 1);
                            specialCharge = Math.min(100, specialCharge + 5);
                            playSE(400, 'square', 0.1);
                        }
                    }
                });
            });

            items.forEach((it, i) => {
                it.update();
                if(it.y > canvas.height) items.splice(i, 1);
                if(player.x < it.x + it.w && player.x + player.w > it.x && player.y < it.y + it.h && player.y + player.h > it.y) {
                    if(it.type === 'P') powerLevel = Math.min(MAX_POWER, powerLevel + 1);
                    else speedLevel = Math.min(MAX_SPEED, speedLevel + 1);
                    items.splice(i, 1);
                    playSE(1000, 'sine', 0.2);
                }
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            });

            scoreDisp.innerText = `SCORE: ${score}`;
            stageDisp.innerText = `STAGE: ${stage}`;
            hpDisp.innerText = `HP: ${hp}`;
            spGauge.style.width = specialCharge + '%';
        }

        function draw() {
            ctx.save();
            if(shakeIntensity > 0.1) {
                ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
            }
            const bgColors = ['#000011', '#001100', '#110000', '#110011', '#001111'];
            ctx.fillStyle = bgColors[(stage-1) % bgColors.length];
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            stars.forEach(s => ctx.fillRect(s.x, s.y, 2, 2));
            if(gameState === 'TITLE') {
                ctx.fillStyle = '#00ff00'; ctx.font = '30px Courier New'; ctx.textAlign = 'center';
                ctx.fillText("ZELBIUS METALLIC", canvas.width/2, 300);
                ctx.font = '20px Courier New'; ctx.fillText("CLICK TO START", canvas.width/2, 350);
                ctx.restore(); return;
            }
            if(gameState === 'GAMEOVER') {
                ctx.fillStyle = '#ff0000'; ctx.font = '40px Courier New'; ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width/2, 300);
                ctx.font = '20px Courier New'; ctx.fillText("CLICK TO RESTART", canvas.width/2, 350);
                ctx.restore(); return;
            }
            if(gameState === 'PAUSED') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '30px Courier New';
                ctx.fillText("PAUSED", canvas.width/2, 300);
                ctx.font = '20px Courier New'; ctx.fillText("Press 'R' to Reset to Title", canvas.width/2, 350);
                ctx.restore(); return;
            }
            if(hitFlash > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${hitFlash/10})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                hitFlash--;
            }
            player.draw();
            ctx.fillStyle = '#ffff00'; bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            ctx.fillStyle = '#f0f'; enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));
            enemies.forEach(e => e.draw());
            items.forEach(it => it.draw());
            particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
            ctx.restore();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
