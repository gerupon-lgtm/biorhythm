<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイオリズム相性診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a12;
    --surface:#12121e;
    --surface2:#1a1a2e;
    --accent:#6c5ce7;
    --accent2:#a29bfe;
    --accent3:#fd79a8;
    --accent4:#ffeaa7;
    --text:#e8e8f0;
    --text2:#9090a8;
    --radius:16px;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:'Zen Maru Gothic','Hiragino Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* === 背景エフェクト === */
  .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-orbs span{
    position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;
    animation:float 20s ease-in-out infinite alternate;
  }
  .bg-orbs span:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%;animation-delay:0s}
  .bg-orbs span:nth-child(2){width:400px;height:400px;background:var(--accent3);bottom:-10%;right:-10%;animation-delay:-7s}
  .bg-orbs span:nth-child(3){width:300px;height:300px;background:var(--accent4);top:40%;left:50%;animation-delay:-14s}
  @keyframes float{
    0%{transform:translate(0,0) scale(1)}
    33%{transform:translate(30px,-40px) scale(1.1)}
    66%{transform:translate(-20px,30px) scale(.95)}
    100%{transform:translate(10px,-10px) scale(1.05)}
  }

  /* === レイアウト === */
  .container{
    position:relative;z-index:1;
    max-width:640px;margin:0 auto;padding:40px 20px 60px;
  }

  /* === ヘッダー === */
  header{text-align:center;margin-bottom:48px}
  .logo{
    font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:4px;text-transform:uppercase;color:var(--accent2);
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.3;
    background:linear-gradient(135deg,var(--accent2),var(--accent3));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{color:var(--text2);font-size:14px;margin-top:8px}

  /* === カード === */
  .card{
    background:var(--surface);
    border:1px solid rgba(108,92,231,.15);
    border-radius:var(--radius);
    padding:32px 28px;
    margin-bottom:24px;
    position:relative;
    transition:border-color .3s;
  }
  .card:hover{border-color:rgba(108,92,231,.35)}
  .card-label{
    position:absolute;top:-12px;left:24px;
    background:var(--accent);color:#fff;
    font-size:12px;font-weight:700;
    padding:4px 14px;border-radius:20px;
    letter-spacing:1px;
  }
  .card-label.person-b{background:var(--accent3)}

  .field-group{margin-bottom:20px}
  .field-group:last-child{margin-bottom:0}
  label{
    display:block;font-size:13px;font-weight:500;
    color:var(--text2);margin-bottom:8px;letter-spacing:.5px;
  }
  input[type="text"],input[type="date"]{
    width:100%;padding:14px 16px;
    background:var(--surface2);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;color:var(--text);font-size:16px;
    font-family:inherit;outline:none;
    transition:border-color .3s,box-shadow .3s;
  }
  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(108,92,231,.15);
  }
  input::placeholder{color:var(--text2);opacity:.5}

  /* === ボタン === */
  .btn-wrap{text-align:center;margin:36px 0}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 48px;border:none;border-radius:50px;
    background:linear-gradient(135deg,var(--accent),var(--accent3));
    color:#fff;font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s;
    box-shadow:0 4px 24px rgba(108,92,231,.3);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(108,92,231,.45)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn .spinner{
    width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;display:none;
  }
  .btn.loading .spinner{display:block}
  .btn.loading .btn-text{opacity:.7}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* === 結果エリア === */
  #result{
    margin-top:20px;
    opacity:0;transform:translateY(20px);
    transition:opacity .6s,transform .6s;
  }
  #result.visible{opacity:1;transform:translateY(0)}

  .result-header{
    text-align:center;margin-bottom:28px;
  }
  .result-header h2{
    font-size:24px;font-weight:700;margin-bottom:4px;
  }
  .score-ring{
    width:140px;height:140px;margin:20px auto;position:relative;
  }
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
  .score-ring .track{stroke:var(--surface2)}
  .score-ring .fill{
    stroke:url(#scoreGrad);
    transition:stroke-dashoffset 1.2s ease;
  }
  .score-value{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'Outfit',sans-serif;
  }
  .score-value .num{font-size:42px;font-weight:700;line-height:1}
  .score-value .pct{font-size:14px;color:var(--text2)}

  /* バイオリズムバー */
  .bio-bars{display:flex;flex-direction:column;gap:14px;margin:24px 0}
  .bio-bar{display:flex;align-items:center;gap:12px}
  .bio-bar .bar-label{
    width:80px;font-size:13px;font-weight:500;color:var(--text2);
    text-align:right;flex-shrink:0;
  }
  .bio-bar .bar-track{
    flex:1;height:10px;background:var(--surface2);border-radius:5px;
    overflow:hidden;position:relative;
  }
  .bio-bar .bar-fill{
    height:100%;border-radius:5px;
    transition:width 1s ease;width:0;
  }
  .bio-bar .bar-val{
    width:40px;font-size:13px;font-weight:600;
    font-family:'Outfit',sans-serif;text-align:left;
  }
  .bar-physical .bar-fill{background:linear-gradient(90deg,#6c5ce7,#a29bfe)}
  .bar-emotional .bar-fill{background:linear-gradient(90deg,#fd79a8,#fab1a0)}
  .bar-intellectual .bar-fill{background:linear-gradient(90deg,#ffeaa7,#fdcb6e)}

  /* AI診断テキスト */
  .diagnosis-text{
    background:var(--surface);
    border:1px solid rgba(108,92,231,.15);
    border-radius:var(--radius);
    padding:28px;
    line-height:1.9;font-size:15px;
    color:var(--text);
    white-space:pre-wrap;
  }
  .diagnosis-text h3{
    font-size:16px;margin-bottom:12px;
    color:var(--accent2);
  }

  /* === エラー === */
  .error-msg{
    text-align:center;padding:20px;
    background:rgba(214,48,49,.1);border:1px solid rgba(214,48,49,.3);
    border-radius:var(--radius);color:#ff7675;
    font-size:14px;margin-top:20px;display:none;
  }
  .error-msg.show{display:block}

  /* === 設定パネル === */
  .settings{
    margin-top:40px;padding-top:24px;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .settings summary{
    font-size:13px;color:var(--text2);cursor:pointer;
    list-style:none;text-align:center;
  }
  .settings summary::-webkit-details-marker{display:none}
  .settings-inner{
    margin-top:16px;
  }
  .settings-inner label{margin-bottom:4px}
  .settings-inner input{margin-bottom:12px}
  .settings-note{font-size:12px;color:var(--text2);opacity:.6;text-align:center;margin-top:8px}

  /* === フッター === */
  footer{
    text-align:center;margin-top:48px;
    font-size:12px;color:var(--text2);opacity:.4;
  }
</style>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="container">

  <header>
    <div class="logo">Biorhythm</div>
    <h1>バイオリズム相性診断</h1>
    <p class="subtitle">二人の生年月日から、身体・感情・知性の波長の相性を診断します</p>
  </header>

  <!-- Person A -->
  <div class="card">
    <span class="card-label">Person A</span>
    <div class="field-group">
      <label for="nameA">名前（ニックネーム可）</label>
      <input type="text" id="nameA" placeholder="例：太郎" maxlength="20">
    </div>
    <div class="field-group">
      <label for="birthA">生年月日</label>
      <input type="date" id="birthA" max="2026-05-17">
    </div>
  </div>

  <!-- Person B -->
  <div class="card">
    <span class="card-label person-b">Person B</span>
    <div class="field-group">
      <label for="nameB">名前（ニックネーム可）</label>
      <input type="text" id="nameB" placeholder="例：花子" maxlength="20">
    </div>
    <div class="field-group">
      <label for="birthB">生年月日</label>
      <input type="date" id="birthB" max="2026-05-17">
    </div>
  </div>

  <!-- 診断ボタン -->
  <div class="btn-wrap">
    <button class="btn" id="diagnoseBtn" onclick="runDiagnosis()">
      <span class="spinner"></span>
      <span class="btn-text">相性を診断する</span>
    </button>
  </div>

  <!-- エラー -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- 結果 -->
  <div id="result">
    <div class="result-header">
      <h2 id="resultTitle"></h2>
    </div>

    <!-- スコアリング -->
    <div class="score-ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <defs>
          <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6c5ce7"/>
            <stop offset="100%" stop-color="#fd79a8"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="70" cy="70" r="60"/>
        <circle class="fill" id="scoreCircle" cx="70" cy="70" r="60"
          stroke-dasharray="377" stroke-dashoffset="377"/>
      </svg>
      <div class="score-value">
        <span class="num" id="scoreNum">0</span>
        <span class="pct">%</span>
      </div>
    </div>

    <!-- バイオリズムバー -->
    <div class="bio-bars">
      <div class="bio-bar bar-physical">
        <span class="bar-label">身体</span>
        <div class="bar-track"><div class="bar-fill" id="barPhysical"></div></div>
        <span class="bar-val" id="valPhysical">0%</span>
      </div>
      <div class="bio-bar bar-emotional">
        <span class="bar-label">感情</span>
        <div class="bar-track"><div class="bar-fill" id="barEmotional"></div></div>
        <span class="bar-val" id="valEmotional">0%</span>
      </div>
      <div class="bio-bar bar-intellectual">
        <span class="bar-label">知性</span>
        <div class="bar-track"><div class="bar-fill" id="barIntellectual"></div></div>
        <span class="bar-val" id="valIntellectual">0%</span>
      </div>
    </div>

    <!-- AI診断テキスト -->
    <div class="diagnosis-text" id="diagnosisText"></div>
  </div>

  <!-- API設定 -->
  <details class="settings">
    <summary>⚙ API接続設定（通常は変更不要）</summary>
    <div class="settings-inner">
      <label for="apiUrl">Vercel APIエンドポイントURL</label>
      <input type="text" id="apiUrl" placeholder="https://your-project.vercel.app/api/diagnose"
        value="">
      <p class="settings-note">デフォルトURLが設定済みです。URLを変更した場合のみここで上書きできます</p>
    </div>
  </details>

  <footer>Biorhythm Compatibility — Powered by Gemini AI</footer>
</div>

<script>
// =============================================
// ★ ここにあなたのVercel URLを設定してください ★
// =============================================
const DEFAULT_API_URL = 'https://test-flax-omega-29.vercel.app/api/diagnose';

// 優先順位: localStorage > デフォルトURL
function getApiUrl() {
  const saved = localStorage.getItem('biorhythm_api_url');
  const input = document.getElementById('apiUrl').value.trim();
  return input || saved || DEFAULT_API_URL;
}

// 初期表示: localStorageに保存があればそれを、なければデフォルトを表示
const savedUrl = localStorage.getItem('biorhythm_api_url');
document.getElementById('apiUrl').value = savedUrl || DEFAULT_API_URL;

document.getElementById('apiUrl').addEventListener('change', function() {
  const val = this.value.trim();
  if (val && val !== DEFAULT_API_URL) {
    localStorage.setItem('biorhythm_api_url', val);
  } else {
    localStorage.removeItem('biorhythm_api_url');
    this.value = DEFAULT_API_URL;
  }
});

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 6000);
}

async function runDiagnosis() {
  const nameA  = document.getElementById('nameA').value.trim() || 'Aさん';
  const nameB  = document.getElementById('nameB').value.trim() || 'Bさん';
  const birthA = document.getElementById('birthA').value;
  const birthB = document.getElementById('birthB').value;
  const apiUrl = getApiUrl();

  if (!birthA || !birthB) { showError('二人の生年月日を入力してください'); return; }
  if (!apiUrl || apiUrl.includes('your-project')) { showError('API接続設定でVercelのURLを設定してください（⚙ を開いてURLを書き換え）'); return; }

  const btn = document.getElementById('diagnoseBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  document.getElementById('result').classList.remove('visible');
  document.getElementById('errorMsg').classList.remove('show');

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nameA, nameB, birthA, birthB }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `サーバーエラー (${res.status})`);
    }

    const data = await res.json();
    displayResult(data, nameA, nameB);
  } catch (e) {
    showError('診断に失敗しました: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function displayResult(data, nameA, nameB) {
  const resultEl = document.getElementById('result');

  // タイトル
  document.getElementById('resultTitle').textContent =
    `${nameA} × ${nameB} の相性`;

  // 総合スコア
  const score = data.overallScore ?? 50;
  const circumference = 2 * Math.PI * 60; // 377
  const offset = circumference * (1 - score / 100);
  document.getElementById('scoreCircle').style.strokeDashoffset = offset;
  animateNumber('scoreNum', score);

  // バー
  setBar('barPhysical',     'valPhysical',     data.physical ?? 50);
  setBar('barEmotional',    'valEmotional',    data.emotional ?? 50);
  setBar('barIntellectual', 'valIntellectual', data.intellectual ?? 50);

  // 診断テキスト
  document.getElementById('diagnosisText').textContent = data.diagnosis || '';

  // 表示
  resultEl.classList.add('visible');
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setBar(barId, valId, pct) {
  setTimeout(() => {
    document.getElementById(barId).style.width = pct + '%';
    document.getElementById(valId).textContent = pct + '%';
  }, 300);
}

function animateNumber(id, target) {
  const el = document.getElementById(id);
  let current = 0;
  const step = Math.max(1, Math.floor(target / 40));
  const interval = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(interval); }
    el.textContent = current;
  }, 30);
}
</script>
</body>
</html>
