<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Neon Symphony - Final</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --bg-dark: #0a0a0c;
        }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
            color: #FFFFFF;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            max-width: 420px;
        }
        .screen {
            text-align: center;
            background: rgba(34, 34, 34, 0.9);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
            backdrop-filter: blur(10px);
        }
        h1 { color: var(--neon-blue); font-size: 2.5em; margin-top: 0; text-shadow: 0 0 10px var(--neon-blue); letter-spacing: 4px; }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #00aa00, #00ff00);
            color: white;
            border: none;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 0 #006600;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #006600; }

        #play-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        #game-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }
        #tetris-grid {
            display: grid;
            grid-template-columns: repeat(10, 20px);
            grid-template-rows: repeat(20, 20px);
            background-color: #000;
            border: 5px solid #333;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        .cell {
            width: 20px;
            height: 20px;
            box-sizing: border-box;
            border: 1px solid #111;
            position: relative;
        }
        .block {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 2px;
            box-shadow: inset 0 3px 4px rgba(255,255,255,0.4), 
                        inset 0 -3px 4px rgba(0,0,0,0.4),
                        0 0 8px currentColor;
        }
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--neon-blue);
            font-weight: bold;
            min-width: 90px;
        }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 22px; margin-bottom: 5px; text-shadow: 0 0 5px var(--neon-blue); }
        #next-preview {
            display: grid;
            grid-template-columns: repeat(4, 20px);
            grid-template-rows: repeat(4, 20px);
            background: #000;
            border: 2px solid #444;
        }
        #controller {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
            width: 100%;
            max-width: 320px;
        }
        .ctrl-btn {
            background: linear-gradient(145deg, #333, #111);
            color: white;
            border: 2px solid #444;
            border-radius: 15px;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #000;
        }
        .btn-rotate { grid-column: 2; border-color: var(--neon-blue); }
        .btn-left { grid-column: 1; }
        .btn-right { grid-column: 3; }
        .btn-down { grid-column: 2; }

        #pause-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        #ranking-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            color: var(--neon-blue);
            font-family: 'Courier New', monospace;
        }
        #ranking-list li { font-size: 18px; margin: 5px 0; border-bottom: 1px solid #333; }
        .flash { animation: flash-animation 0.2s ease-out; }
        @keyframes flash-animation {
            0% { background-color: #fff; }
            100% { background-color: transparent; }
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

</script>
