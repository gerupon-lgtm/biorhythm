<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GALAXY SHOT - EVOLUTION OVERDRIVE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }
        #game-container {
            position: relative;
            width: 480px;
            height: 640px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            background: #000;
            max-width: 100vw;
            max-height: 100dvh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 {
            font-size: 32px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 10px;
            text-align: center;
        }
        .blink {
            animation: blinker 1s linear infinite;
            color: #ff00ff;
            font-weight: bold;
            margin: 15px 0;
            font-size: 20px;
        }
        @keyframes blinker { 50% { opacity: 0; } }
        
        button {
            background: #111;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 0 5px #00ffff;
            transition: all 0.2s;
        }
        button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }
        
        .level-select {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .level-btn {
            font-size: 14px;
            padding: 6px 14px;
            border-color: #555;
            color: #555;
            box-shadow: none;
        }
        .level-btn.active {
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }

        .info-text {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
            margin: 10px 0;
        }
        
        table {
            width: 80%;
            margin-top: 10px;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 4px 8px;
            text-align: left;
        }
        th { color: #ff00ff; }
        td { color: #fff; }

        #name-input-container {
            margin: 15px 0;
            text-align: center;
        }
        #player-name {
            background: #222;
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
            width: 150px;
        }

        #touch-pause-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            width: 46px;
            height: 44px;
            background: rgba(20, 20, 35, 0.85);
            border: 2px solid rgba(0, 255, 255, 0.8);
            border-radius: 6px;
            color: #00ffff;
            font-size: 18px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 6;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        @media (max-width: 500px) or (max-height: 660px) {
            #game-container { 
                width: 100vw; 
                height: 100dvh; 
                box-shadow: none; 
            }
            #touch-pause-btn { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <button id="touch-pause-btn">⏸</button>

    <div id="title-screen" class="overlay">
        <h1>GALAXY SHOT</h1>
        <div style="font-size: 12px; color: #00ffff;">SELECT LEVEL</div>
        <div class="level-select">
            <button id="lvl-easy" class="level-btn">EASY</button>
            <button id="lvl-normal" class="level-btn active">NORMAL</button>
            <button id="lvl-hard" class="level-btn">HARD</button>
        </div>
        <button id="start-game-btn" style="margin-top: 5px;">CLICK TO START</button>
        <div class="info-text">
            [PC CONTROLS]<br>
            ← / A : LEFT | → / D : RIGHT | SPACE : FIRE | ESC : PAUSE<br>
            [SMARTPHONE]<br>
            DRAG : MOVE & AUTOMATIC SHOT
        </div>
        <table>
            <thead><tr><th>RANK</th><th>NAME</th><th>SCORE</th></tr></thead>
            <tbody id="leaderboard-body-title"></tbody>
        </table>
    </div>

    <div id="pause-screen" class="overlay hidden">
        <h1>PAUSED</h1>
        <button id="resume-btn">RESUME</button>
        <button id="reset-btn">RESET GAME</button>
        <button id="to-title-btn">QUIT TO TITLE</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
        <h1 style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">GAME OVER</h1>
        <div id="final-score-text" style="font-size: 20px; margin: 10px 0;">SCORE: 0</div>
        <div id="name-input-container" class="hidden">
            <div style="color: #ffff00; margin-bottom: 5px;" class="blink">NEW RECORD!</div>
            <input type="text" id="player-name" maxlength="8" value="PLAYER1"><br><br>
            <button id="submit-score-btn">SAVE SCORE</button>
        </div>
        <button id="retry-btn">RETRY</button>
        <button id="go-title-btn">TITLE</button>
    </div>
</div>

<script>
// ============================================================================
// ⚙️ ユーザーカスタマイズ用ゲームパラメータ設定エリア
// ============================================================================
const GAME_CONFIG = {
    // 🛸 プレイヤー（自機）設定
    PLAYER_INITIAL_LIFE: 3,         // ゲーム開始時の残り残機
    PLAYER_INITIAL_SPEED: 5,        // 自機の移動スピード初期値（Lv1）
    PLAYER_MAX_SPEED: 9,            // 自機の移動スピード最大値（Lv5 = カンスト）
    PLAYER_INITIAL_POWER: 1,        // ショットパワーの初期値（Lv1）
    PLAYER_MAX_POWER: 5,            // ショットパワーの最大値（Lv5 = カンスト）
    PLAYER_RESPAWN_INVULNERABLE: 120, // ミス後の復活時の基本無敵時間（フレーム数、120=2秒）

    // 💰 アイテム貯金システム（ストック機能）設定
    STOCK_MAX_LIMIT: 2,             // ショット/スピードがLV5の時に貯金できる最大個数
    STOCK_UNLOCK_STAGE_EASY: 16,    // EASYモードで貯金システムが解放されるステージ数
    STOCK_UNLOCK_STAGE_NORMAL: 8,   // NORMALモードで貯金システムが解放されるステージ数
    STOCK_UNLOCK_STAGE_HARD: 4,     // HARDモードで貯金システムが解放されるステージ数

    // ⚡ オーバードライブ（カンスト限定無限無双モード）設定
    OD_ITEM_DROP_CHANCE: 0.04,      // カンスト状態で敵を倒した時にアイテムが出る基本確率（0.04 = 4%）
    OD_DURATION: 300,               // オーバードライブの持続時間（フレーム数、300=5秒）
    OD_ITEM_LIFETIME: 600,          // カンストアイテムが自然消滅するまでの寿命（フレーム数、600=10秒）
    OD_MIN_COOLDOWN_SEC: 60,        // アイテム取得後の最低クールダウン時間（秒数）
    OD_MAX_COOLDOWN_SEC: 90,        // アイテム取得後の最大クールダウン時間（秒数）

    // 👾 敵・ステージ基本設定
    ENEMY_BASE_DROP_CHANCE: 0.15,   // 通常の敵がパワーアップ・スピードアイテムを落とす確率（0.15 = 15%）
    BONUS_ENEMY_DROP_CHANCE: 0.10,  // ボーナスステージの敵がアイテムを落とす確率（0.10 = 10%）
    EXTEND_SCORE_THRESHOLD: 20000,  // 残機が増える（1UPする）ごとに必要なスコア値

    // ⏱️ モード別制限時間設定（秒数）
    BONUS_STAGE_TIME_EASY: 15.0,    // ボーナスステージ制限時間：EASY（秒）
    BONUS_STAGE_TIME_NORMAL: 12.0,  // ボーナスステージ制限時間：NORMAL（秒）
    BONUS_STAGE_TIME_HARD: 8.0,     // ボーナスステージ制限時間：HARD（秒）

    BOSS_STAGE_TIME_EASY: 45.0,     // ボス戦制限時間：EASY（秒）
    BOSS_STAGE_TIME_NORMAL: 35.0,   // ボス戦制限時間：NORMAL（秒）
    BOSS_STAGE_TIME_HARD: 25.0,     // ボス戦制限時間：HARD（秒）

    // ☄️ 隠れキャラ（ラッキーメテオ）設定
    METEOR_SPAWN_CHANCE: 0.003,     // 各ステージ開始時に隠れキャラ（メテオ）の出現フラグが立つ確率（0.003 = 0.3%）
    METEOR_SCORE_VALUE: 20000       // 隠れキャラを破壊した際に獲得できるボーナススコア＆1UP
};
// ============================================================================


// --- 1. サウンド管理 (Web Audio API) ---
class SoundManager {
    constructor() { 
        this.ctx = null; 
        this.bgmInterval = null;
        this.bgmStep = 0;
        this.isBgmPlaying = false;
    }
    init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } }
    
    playTone(freq, type, duration, volume = 0.1, slideTo = 0, delay = 0) {
        if (!this.ctx) return;
        try {
            let time = this.ctx.currentTime + delay;
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);
            if (slideTo > 0) { osc.frequency.exponentialRampToValueAtTime(slideTo, time + duration); }
            gain.gain.setValueAtTime(volume, time);
            gain.gain.exponentialRampToValueAtTime(0.00001, time + duration);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(time); osc.stop(time + duration);
        } catch(e) {}
    }
    
    playNoise(duration, volume = 0.1) {
        if (!this.ctx) return;
        try {
            let bufferSize = this.ctx.sampleRate * duration;
            let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            let data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            let noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            let gain = this.ctx.createGain();
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, duration);
            noise.connect(gain); gain.connect(this.ctx.destination);
            noise.start();
        } catch(e) {}
    }
    
    playShot() { this.playTone(600, 'square', 0.15, 0.06, 150); }
    playLaser() { this.playTone(800, 'sawtooth', 0.1, 0.04, 300); }
    playODShot() { this.playTone(1200, 'square', 0.08, 0.04, 600); }
    playExplode() { this.playNoise(0.3, 0.18); }
    playBossExplode() {
        this.playNoise(0.8, 0.25);
        this.playTone(120, 'sawtooth', 0.6, 0.25, 40);
    }
    playPlayerDamage() { this.playTone(300, 'sawtooth', 0.5, 0.18, 50); }
    playItemGet() {
        this.playTone(880, 'sine', 0.1, 0.08);
        setTimeout(() => this.playTone(1320, 'sine', 0.1, 0.08), 70);
        setTimeout(() => this.playTone(1760, 'sine', 0.15, 0.08), 140);
    }
    playODSpawn() {
        for(let i=0; i<6; i++) {
            setTimeout(() => this.playTone(800 + i*250, 'sawtooth', 0.08, 0.06, 2500), i*50);
        }
    }
    playODActivate() {
        const sequence = [523.3, 659.3, 784.0, 1046.5];
        sequence.forEach((freq, idx) => {
            this.playTone(freq, 'sawtooth', 0.18, 0.12, 0, idx * 0.08);
        });
    }
    playItemSpawn() {
        this.playTone(1000, 'sine', 0.05, 0.05);
        setTimeout(() => this.playTone(1500, 'sine', 0.05, 0.05), 50);
    }
    play1UP() {
        const notes = [1318.5, 1568.0, 2093.0];
        notes.forEach((n, i) => { this.playTone(n, 'square', 0.12, 0.08, 0, i * 0.08); });
    }
    playBossWarning() {
        for(let i = 0; i < 3; i++) { this.playTone(220, 'sawtooth', 0.2, 0.15, 440, i * 0.4); }
    }
    playBossFlee() {
        this.playTone(440, 'sawtooth', 1.0, 0.1, 880);
    }
    playStartJingle() {
        const notes = [261.6, 329.6, 392.0, 523.3];
        notes.forEach((t, i) => { this.playTone(t, 'square', 0.15, 0.08, 0, i * 0.12); });
    }
    playClearJingle() {
        const notes = [440, 494, 523, 587, 659, 0, 659, 698, 784];
        notes.forEach((t, i) => { if(t > 0) this.playTone(t, 'square', 0.12, 0.08, 0, i * 0.1); });
    }
    playGameOverJingle() {
        const notes = [392, 349, 311, 261];
        notes.forEach((t, i) => { this.playTone(t, 'sawtooth', 0.25, 0.1, 0, i * 0.2); });
    }

    startBGM() {
        if (this.isBgmPlaying) return;
        this.isBgmPlaying = true;
        const pattern = [110, 110, 130, 146, 110, 110, 165, 146, 117, 117, 138, 155, 117, 117, 174, 155];
        this.bgmInterval = setInterval(() => {
            let freq = pattern[this.bgmStep % pattern.length];
            if (window.gameInstance && window.gameInstance.bosses.length > 0) freq *= 1.2;
            if (window.gameInstance && window.gameInstance.player.odTimer > 0) freq *= 1.5;
            this.playTone(freq, 'triangle', 0.12, 0.06);
            this.bgmStep++;
        }, 160);
    }
    stopBGM() {
        clearInterval(this.bgmInterval);
        this.bgmInterval = null;
        this.isBgmPlaying = false;
    }
}
const sound = new SoundManager();

// --- 2. スコア & エクステンド管理 ---
class ScoreManager {
    constructor() {
        this.score = 0;
        this.extendTracker = 0;
        const savedHi = localStorage.getItem('galaxy_hi_score');
        this.highScore = (savedHi !== null && savedHi !== undefined) ? parseInt(savedHi) : 10000;
        
        this.ranking = JSON.parse(localStorage.getItem('galaxy_ranking')) || [
            {name: 'ACE', score: 10000, date: ''},
            {name: 'PILOT', score: 5000, date: ''},
            {name: 'ROOKIE', score: 1000, date: ''}
        ];
    }
    addScore(amount) {
        this.score += amount;
        this.extendTracker += amount;
        if (this.extendTracker >= GAME_CONFIG.EXTEND_SCORE_THRESHOLD) {
            if (window.gameInstance) { window.gameInstance.life++; sound.play1UP(); }
            this.extendTracker %= GAME_CONFIG.EXTEND_SCORE_THRESHOLD;
        }
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('galaxy_hi_score', this.highScore);
        }
    }
    reset() { this.score = 0; this.extendTracker = 0; }
    checkRankingEligibility() { return this.ranking.length < 5 || this.score > this.ranking[this.ranking.length - 1].score; }
    saveRanking(name) {
        const entry = { name: name.toUpperCase().substring(0, 8) || 'ANON', score: this.score, date: new Date().toLocaleDateString() };
        this.ranking.push(entry);
        this.ranking.sort((a, b) => b.score - a.score);
        this.ranking = this.ranking.slice(0, 5);
        localStorage.setItem('galaxy_ranking', JSON.stringify(this.ranking));
    }
}
const scores = new ScoreManager();

// --- 3. ゲームエンティティ定義 ---
class Player {
    constructor(canvasWidth, canvasHeight) {
        this.canvasWidth = canvasWidth; this.canvasHeight = canvasHeight;
        this.width = 24; this.height = 24;
        this.x = canvasWidth / 2 - this.width / 2;
        this.y = canvasHeight - 110; 
        this.baseSpeed = GAME_CONFIG.PLAYER_INITIAL_SPEED; this.speed = this.baseSpeed;
        this.powerLevel = GAME_CONFIG.PLAYER_INITIAL_POWER; this.invulnerableTimer = 0;
        this.visible = true;
        this.odTimer = 0;

        // 💰 貯金（ストック）用プロパティ
        this.powerStock = 0;
        this.speedStock = 0;
    }
    reset() {
        this.x = this.canvasWidth / 2 - this.width / 2;
        this.y = this.canvasHeight - 110;
        
        // 💰 復活時：ストックを全消費して適用
        this.powerLevel = Math.min(GAME_CONFIG.PLAYER_MAX_POWER, GAME_CONFIG.PLAYER_INITIAL_POWER + this.powerStock);
        let speedLevel = Math.min(GAME_CONFIG.PLAYER_MAX_SPEED - GAME_CONFIG.PLAYER_INITIAL_SPEED + 1, 1 + this.speedStock);
        this.speed = GAME_CONFIG.PLAYER_INITIAL_SPEED + (speedLevel - 1);
        
        // ⚡ 【救済仕様】貯金モード解放済みかつ、復活時に両方Lv1（ストックがなかった）の場合、バリア時間を2倍にする
        let baseInvulnerable = GAME_CONFIG.PLAYER_RESPAWN_INVULNERABLE;
        if (window.gameInstance && window.gameInstance.isStockUnlocked()) {
            let spdLevelVisual = this.speed - (GAME_CONFIG.PLAYER_INITIAL_SPEED - 1);
            if (this.powerLevel === 1 && spdLevelVisual === 1) {
                baseInvulnerable *= 2; // バリア時間を倍増（4秒）
            }
        }

        // 消費したためストックはゼロにリセット
        this.powerStock = 0;
        this.speedStock = 0;

        this.invulnerableTimer = baseInvulnerable;
        this.visible = true;
        this.odTimer = 0;
    }
    update(keys, touchMove) {
        if (!this.visible) return;
        
        if (this.odTimer > 0) {
            this.odTimer--;
            this.invulnerableTimer = Math.max(this.invulnerableTimer, 2);
        }

        let currentSpeed = this.speed;
        let dx = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) dx = -currentSpeed;
        if (keys['ArrowRight'] || keys['KeyD']) dx = currentSpeed;
        if (touchMove !== 0) dx = touchMove;
        this.x += dx;
        
        let maxX = this.canvasWidth - this.width;
        if (window.gameInstance && window.gameInstance.isTouchDevice) {
            maxX = this.canvasWidth - this.width - 45; 
        }

        if (this.x < 0) this.x = 0;
        if (this.x > maxX) this.x = maxX;
        
        const minY = 85;
        const maxY = this.canvasHeight - 75 - this.height; 
        if (this.y < minY) this.y = minY;
        if (this.y > maxY) this.y = maxY;

        if (this.invulnerableTimer > 0) this.invulnerableTimer--;
    }
    draw(ctx, globalTimer) {
        if (!this.visible) return;
        
        if (this.odTimer > 0) {
            ctx.save();
            const hue = (globalTimer * 12) % 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
            ctx.fillRect(this.x + 4, this.y, 16, 20);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x + 8, this.y + 4, 8, 8);
            ctx.fillStyle = `hsl(${(hue + 180) % 360}, 100%, 50%)`;
            ctx.fillRect(this.x - 4, this.y + 10, 8, 10);
            ctx.fillRect(this.x + 20, this.y + 10, 8, 10);
            if (globalTimer % 2 === 0) {
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(this.x + 6, this.y + 20, 12, 6);
            }
            ctx.restore();

            ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`; ctx.lineWidth = 3; ctx.beginPath();
            ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 24, 0, Math.PI * 2); ctx.stroke();
            return;
        }

        if (!(this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0)) {
            ctx.save();
            ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x + 10, this.y, 4, 6);
            ctx.fillStyle = '#3a86ff'; ctx.fillRect(this.x + 6, this.y + 6, 12, 14);
            ctx.fillStyle = '#ff0055'; ctx.fillRect(this.x, this.y + 12, 6, 8); ctx.fillRect(this.x + 18, this.y + 12, 6, 8);
            if (Math.random() > 0.5) { ctx.fillStyle = '#ffaa00'; ctx.fillRect(this.x + 10, this.y + 20, 4, 4); }
            ctx.restore();
        }
        if (this.invulnerableTimer > 0) {
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 20, 0, Math.PI * 2); ctx.stroke();

            ctx.save();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.75)';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'center';
            let secondsLeft = (this.invulnerableTimer / 60).toFixed(1);
            ctx.fillText(`${secondsLeft}s`, this.x + this.width / 2, this.y - 10);
            ctx.restore();
        }
    }
}

class Bullet {
    constructor(x, y, vx, vy, isLaser = false, isEnemy = false, isOD = false) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.width = isLaser ? 12 : (isEnemy ? 6 : (isOD ? 5 : 4));
        this.height = isLaser ? 32 : (isOD ? 14 : 10);
        this.isLaser = isLaser; this.isEnemy = isEnemy; this.isOD = isOD; this.active = true;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.y < -40 || this.y > 660 || this.x < -20 || this.x > 500) this.active = false;
    }
    draw(ctx) { 
        ctx.save();
        if (this.isEnemy) {
            ctx.fillStyle = '#ff007f';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 6;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x + 1.5, this.y + 2, this.width - 3, this.height - 4);
        } else if (this.isOD) {
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 8;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x + 1, this.y + 2, this.width - 2, this.height - 4);
        } else {
            if (this.isLaser) {
                ctx.fillStyle = '#cc00ff';
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 3, this.y + 6, this.width - 6, this.height - 12);
            } else {
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 4;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, type, stage, levelFactor, isBonus = false, isOftomo = false, isBonusChild = false) {
        this.x = x; this.y = y; this.startX = x; this.startY = y; this.type = type;
        this.width = isBonusChild ? 12 : 20; 
        this.height = isBonusChild ? 12 : 20; 
        this.active = true;
        this.isBonus = isBonus;
        this.isOftomo = isOftomo;
        this.isBonusChild = isBonusChild; 
        this.scoreValue = isBonus ? (isBonusChild ? 500 : 300) : (isOftomo ? 50 : (type === 2 ? 150 : (type === 3 ? 200 : 100)));
        this.swingOffset = Math.random() * Math.PI * 2;
        this.state = isOftomo ? 'swoop' : 'grid'; 
        this.timer = 0;
        this.speedFactor = (1 + (stage * 0.08)) * levelFactor;
        
        if (window.gameInstance && window.gameInstance.level === 'HARD' && !isBonus && !isOftomo) {
            this.speedFactor *= 1.3;
        }

        this.shotCooldown = 0;

        this.bonusVx = (Math.random() > 0.5 ? 3.2 : -3.2) * (1 + stage * 0.02) * levelFactor;
        this.movePattern = Math.random() < 0.5 ? 'sine' : 'normal'; 
        if (this.isBonusChild) {
            this.bonusVx = (Math.random() > 0.5 ? 6.5 : -6.5) * levelFactor; 
            this.movePattern = 'crazy';
        }
    }
    update() {
        this.timer++;
        if (this.shotCooldown > 0) this.shotCooldown--;
        
        if (this.isBonus) {
            this.x += this.bonusVx;
            if (this.movePattern === 'sine') {
                this.y = this.startY + Math.sin(this.timer * 0.08 + this.swingOffset) * 35 + Math.cos(this.timer * 0.03) * 30;
            } else if (this.movePattern === 'crazy') {
                this.y = this.startY + Math.sin(this.timer * 0.2) * 50;
                if (this.timer % 30 === 0) this.bonusVx *= -1.3; 
            } else {
                this.y = this.startY + Math.sin(this.timer * 0.05) * 40;
                if (this.timer % 45 === 0 && Math.random() < 0.4) {
                    this.bonusVx *= 1.5;
                } else if (this.timer % 60 === 0) {
                    this.bonusVx = (this.bonusVx > 0 ? 3.2 : -3.2);
                }
            }
            if (this.x < 15 || this.x > 480 - this.width - 15) { 
                this.bonusVx *= -1; 
                this.x = Math.max(15, Math.min(this.x, 480 - this.width - 15));
            }
            return;
        }

        if (this.isOftomo) {
            this.y += 3.5 * this.speedFactor;
            this.x += Math.sin(this.timer * 0.08 + this.swingOffset) * 2.5 * this.speedFactor;
            if (this.y > 640) this.active = false;
            return;
        }

        if (this.state === 'grid') {
            this.x = this.startX + Math.sin(this.timer * 0.03 + this.swingOffset) * 20;
            
            let swoopChance = 0.0006;
            if (window.gameInstance && window.gameInstance.level === 'HARD') swoopChance = 0.0015;
            
            if (Math.random() < swoopChance) { this.state = 'swoop'; }
        } else if (this.state === 'swoop') {
            this.y += 3.2 * this.speedFactor;
            this.x += Math.sin(this.timer * 0.05) * 2 * this.speedFactor;
            if (this.y >= 640) { this.y = -40; this.state = 'returning'; }
        } else if (this.state === 'returning') {
            let targetX = this.startX + Math.sin(this.timer * 0.03 + this.swingOffset) * 20;
            let dx = targetX - this.x; let dy = this.startY - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let returnSpeed = 5.5 * this.speedFactor;
            if (distance > returnSpeed) { this.x += (dx / distance) * returnSpeed; this.y += (dy / distance) * returnSpeed; }
            else { this.x = targetX; this.y = this.startY; this.state = 'grid'; }
        }
    }
    draw(ctx) {
        ctx.save();
        if (this.isBonus) {
            if (this.isBonusChild) {
                ctx.fillStyle = '#ff00ff'; ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x + 3, this.y + 3, 6, 3);
            } else {
                ctx.fillStyle = '#ffcc00'; ctx.fillRect(this.x, this.y, 20, 20);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x + 4, this.y + 4, 12, 6);
                ctx.fillStyle = '#ff3300'; ctx.fillRect(this.x + 2, this.y + 14, 4, 4); ctx.fillRect(this.x + 14, this.y + 14, 4, 4);
            }
        } else if (this.isOftomo) {
            ctx.fillStyle = '#00ffff'; ctx.fillRect(this.x + 4, this.y, 12, 12);
            ctx.fillStyle = '#ff00ff'; ctx.fillRect(this.x, this.y + 6, 20, 4);
        } else if (this.type === 1) {
            ctx.fillStyle = '#ff00ff'; ctx.fillRect(this.x + 4, this.y, 12, 12);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x, this.y + 4, 4, 4); ctx.fillRect(this.x + 16, this.y + 4, 4, 4);
        } else if (this.type === 2) {
            ctx.fillStyle = (window.gameInstance && window.gameInstance.stage >= 3) ? '#ff3333' : '#00ff66'; 
            ctx.fillRect(this.x + 2, this.y + 2, 16, 10);
            ctx.fillStyle = '#ffff00'; ctx.fillRect(this.x + 4, this.y + 12, 2, 6); ctx.fillRect(this.x + 14, this.y + 12, 2, 6);
        } else {
            ctx.fillStyle = '#ffea00'; ctx.fillRect(this.x, this.y, 20, 8);
            ctx.fillStyle = '#ff5500'; ctx.fillRect(this.x + 6, this.y + 8, 8, 8);
        }
        ctx.restore();
    }
}

class LuckyMeteor {
    constructor() {
        this.width = 16; this.height = 16;
        this.x = -40; 
        this.y = 95 + Math.random() * 25; 
        this.vx = 9.5; 
        this.active = true;
        this.scoreValue = GAME_CONFIG.METEOR_SCORE_VALUE;
    }
    update() {
        this.x += this.vx;
        if (this.x > 500) this.active = false;
    }
    draw(ctx, globalTimer) {
        ctx.save();
        ctx.fillStyle = (Math.floor(globalTimer / 3) % 2 === 0) ? '#ff00ff' : '#9900ff';
        ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 12;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = 'rgba(255, 0, 255, 0.4)';
        ctx.fillRect(this.x - 15, this.y + 3, 15, 10);
        ctx.restore();
    }
}

class BossEnemy {
    constructor(x, targetY, stage, levelFactor, currentLevel) {
        this.width = 64; this.height = 48;
        this.x = x; this.y = -60; this.targetY = targetY;
        this.active = true; this.isBoss = true;
        
        if (currentLevel === 'EASY') {
            this.maxHp = 10 + (stage * 2);
        } else if (currentLevel === 'NORMAL') {
            this.maxHp = 10 + (stage * 1.5); 
        } else {
            this.maxHp = 10 + (stage * 3.5);
        }
        
        this.hp = this.maxHp;
        this.scoreValue = 2000; this.timer = Math.random() * 100; 
        this.vx = 1.8 * levelFactor * (Math.random() > 0.5 ? 1 : -1); this.hurtTimer = 0;
        this.isFleeing = false;
    }
    update() {
        this.timer++;
        if (this.hurtTimer > 0) this.hurtTimer--;

        if (this.isFleeing) {
            this.y -= 7;
            if (this.y < -80) { this.active = false; }
            return;
        }

        if (this.y < this.targetY) { this.y += 2; return; }
        this.x += this.vx;
        if (this.x < 15 || this.x > 480 - this.width - 15) { this.vx *= -1; }
        this.y = this.targetY + Math.sin(this.timer * 0.04) * 15;
    }
    draw(ctx) {
        ctx.save();
        if (this.hurtTimer > 0 && Math.floor(this.hurtTimer / 2) % 2 === 0) {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x, this.y, this.width, this.height);
        } else {
            const cx = this.x; const cy = this.y;
            ctx.fillStyle = '#9900ff'; ctx.fillRect(cx + 12, cy + 4, 40, 16); ctx.fillRect(cx + 4, cy + 16, 56, 16);  
            ctx.fillStyle = '#00ffff'; ctx.fillRect(cx, cy, 6, 24); ctx.fillRect(cx + 58, cy, 6, 24); ctx.fillRect(cx + 4, cy + 32, 10, 16); ctx.fillRect(cx + 50, cy + 32, 10, 16); 
            ctx.fillStyle = '#ff0055'; ctx.fillRect(cx + 24, cy + 12, 16, 12); ctx.fillStyle = '#ffffff'; ctx.fillRect(cx + 28, cy + 16, 8, 4);   
            ctx.fillStyle = '#ffff00'; ctx.fillRect(cx + 14, cy, 4, 4); ctx.fillRect(cx + 46, cy, 4, 4);        
        }
        if (!this.isFleeing) {
            ctx.fillStyle = '#222'; ctx.fillRect(this.x, this.y - 12, this.width, 4);
            ctx.fillStyle = '#ff0055'; ctx.fillRect(this.x, this.y - 12, this.width * (this.hp / this.maxHp), 4);
        }
        ctx.restore();
    }
}

class Item {
    constructor(x, y, forcedType = null) {
        this.x = x; this.y = y; this.active = true;
        this.isStatic = (forcedType === 'O');
        
        this.width = this.isStatic ? 22 : 16;
        this.height = this.isStatic ? 22 : 16;
        
        this.lifeTimer = this.isStatic ? GAME_CONFIG.OD_ITEM_LIFETIME : 240; 

        if (forcedType) {
            this.type = forcedType; 
        } else {
            if (window.gameInstance && 
                window.gameInstance.player.powerLevel === GAME_CONFIG.PLAYER_MAX_POWER && 
                window.gameInstance.player.speed === GAME_CONFIG.PLAYER_MAX_SPEED) {
                const r = Math.random(); 
                this.type = r > 0.8 ? 'B':'';
                // this.type = 'B';
            } else {
                const r = Math.random(); 
                this.type = r < 0.5 ? 'P' : (r < 0.8 ? 'S' : 'B');
            }
        }
    }
    update() { 
        if (this.isStatic) {
            this.lifeTimer--;
            this.y += Math.sin(this.lifeTimer * 0.1) * 0.2;
            
            if (this.lifeTimer > 0 && Math.random() < 0.18) {
                if (window.gameInstance) {
                    const hue = (window.gameInstance.globalTimer * 6) % 360;
                    window.gameInstance.particles.push(new Particle(
                        this.x + this.width / 2 + (Math.random() - 0.5) * 10,
                        this.y + this.height / 2 + (Math.random() - 0.5) * 10,
                        `hsl(${hue}, 100%, 65%)`,
                        (Math.random() - 0.5) * 1.5,
                        (Math.random() - 0.5) * 1.5
                    ));
                }
            }
            if (this.lifeTimer <= 0) this.active = false; 
        } else {
            this.y += 2; 
            if (this.y > 640) this.active = false; 
        }
    }
    draw(ctx, globalTimer) {
        ctx.save();
        
        const blinkThreshold = this.isStatic ? 120 : 60;
        if (this.lifeTimer < blinkThreshold && Math.floor(this.lifeTimer / 4) % 2 === 0) {
            ctx.restore();
            return;
        }

        if (this.type === 'O') {
            const rainbow = (globalTimer * 6) % 360;
            const cx = this.x + this.width / 2;
            const cy = this.y + this.height / 2;

            ctx.shadowColor = `hsl(${rainbow}, 100%, 60%)`;
            ctx.shadowBlur = 14;

            ctx.strokeStyle = `hsl(${(rainbow + 180) % 360}, 100%, 60%)`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + (globalTimer * 0.03);
                const rx = cx + Math.cos(angle) * (this.width / 2);
                const ry = cy + Math.sin(angle) * (this.height / 2);
                if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, 6 + Math.sin(globalTimer * 0.15) * 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("O", cx, cy + 0.5);
        } else {
        if (this.type != ''){
            ctx.fillStyle = (Math.floor(globalTimer / 10) % 2 === 0) ? '#ffffff' : (this.type === 'P' ? '#ff00ff' : (this.type === 'S' ? '#00ffff' : '#ffff00'));
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            ctx.fillStyle = '#000000'; 
            ctx.font = 'bold 12px monospace'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.type, this.x + this.width / 2, this.y + this.height / 2 + 1); 
            }
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color = null, vx = null, vy = null) {
        this.x = x; this.y = y;
        this.vx = vx !== null ? vx : (Math.random() - 0.5) * 6;
        this.vy = vy !== null ? vy : (Math.random() - 0.5) * 6;
        this.life = 30 + Math.random() * 20; this.maxLife = this.life;
        this.color = color || (Math.random() > 0.5 ? '#ff5500' : '#ffcc00');
    }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw(ctx) { ctx.fillStyle = this.color; const size = (this.life / this.maxLife) * 4; ctx.fillRect(this.x, this.y, size, size); }
}

// --- 4. メインシステム制御 ---
class Game {
    constructor() {
        window.gameInstance = this;
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.state = 'TITLE'; this.level = 'NORMAL';
        
        this.player = new Player(480, 640);
        this.life = GAME_CONFIG.PLAYER_INITIAL_LIFE; this.stage = 1;
        this.bullets = []; this.enemyBullets = []; this.enemies = []; this.bosses = []; this.items = []; this.particles = []; this.stars = [];
        this.luckyMeteors = []; 
        
        this.keys = {}; this.globalTimer = 0; this.screenShake = 0;
        this.playerRespawnTimer = 0; this.stageClearTimer = 0;
        
        this.isTouching = false; this.lastTouchX = 0; this.touchDx = 0; this.autoShotTimer = 0;
        
        this.stageType = 'NORMAL';
        this.bossSpawned = false;
        
        this.bonusTimer = 0; 
        this.bonusPerfect = false;
        
        this.bossTimer = 0;
        this.bossFled = false;

        this.safetyStartTimer = 0;
        this.odItemCooldownTimer = 0;
        this.flashOverlayTimer = 0;

        this.isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        this.initStars(); this.bindEvents(); this.updateLeaderboards(); this.loop();
    }

    getLevelFactor() {
        if (this.level === 'EASY') return 0.85;
        if (this.level === 'HARD') return 1.35;
        return 1.0;
    }

    // 💰 貯金システムが解放されているか判定するメソッド
    isStockUnlocked() {
        if (this.level === 'EASY' && this.stage >= GAME_CONFIG.STOCK_UNLOCK_STAGE_EASY) return true;
        if (this.level === 'NORMAL' && this.stage >= GAME_CONFIG.STOCK_UNLOCK_STAGE_NORMAL) return true;
        if (this.level === 'HARD' && this.stage >= GAME_CONFIG.STOCK_UNLOCK_STAGE_HARD) return true;
        return false;
    }

    initStars() {
        this.stars = [];
        for (let i = 0; i < 60; i++) { this.stars.push({ x: Math.random() * 480, y: Math.random() * 640, speed: 1 + Math.random() * 2, size: Math.random() * 2 }); }
    }

    spawnStageElements() {
        this.enemies = []; this.bosses = []; this.luckyMeteors = [];
        this.bossSpawned = false;
        this.bonusPerfect = false;
        this.bossFled = false;

        this.safetyStartTimer = 90;

        const remainder = this.stage % 7;

        if (remainder === 3 || remainder === 6) {
            this.stageType = 'BOSS';
            this.spawnBossForCurrentStage();
            this.bossSpawned = true;

            if (this.level === 'EASY') { this.bossTimer = GAME_CONFIG.BOSS_STAGE_TIME_EASY * 60; } 
            else if (this.level === 'NORMAL') { this.bossTimer = GAME_CONFIG.BOSS_STAGE_TIME_NORMAL * 60; } 
            else { this.bossTimer = GAME_CONFIG.BOSS_STAGE_TIME_HARD * 60; }

        } else if (remainder === 0) {
            this.stageType = 'BONUS';
            if (this.level === 'EASY') { this.bonusTimer = GAME_CONFIG.BONUS_STAGE_TIME_EASY * 60; } 
            else if (this.level === 'NORMAL') { this.bonusTimer = GAME_CONFIG.BONUS_STAGE_TIME_NORMAL * 60; } 
            else { this.bonusTimer = GAME_CONFIG.BONUS_STAGE_TIME_HARD * 60; }
            
            const count = 8;
            for (let i = 0; i < count; i++) {
                this.enemies.push(new Enemy(40 + i * 45, 160, 1, this.stage, this.getLevelFactor(), true)); 
            }
        } else {
            this.stageType = 'NORMAL';
            const cols = 6, rows = 3; const factor = this.getLevelFactor();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    this.enemies.push(new Enemy(80 + c * 50, 105 + r * 35, r + 1, this.stage, factor, false)); 
                }
            }
        }

        if (Math.random() < GAME_CONFIG.METEOR_SPAWN_CHANCE) {
            this.luckyMeteorSpawnFrame = this.globalTimer + 180 + Math.floor(Math.random() * 300);
        } else {
            this.luckyMeteorSpawnFrame = -1;
        }
    }

    spawnBossForCurrentStage() {
        this.bosses = [];
        const factor = this.getLevelFactor();
        sound.playBossWarning();

        if (this.level === 'EASY') {
            this.bosses.push(new BossEnemy(240 - 32, 120, this.stage, factor, this.level)); 
        } else if (this.level === 'NORMAL') {
            if (this.stage >= 6) {
                this.bosses.push(new BossEnemy(140 - 32, 120, this.stage, factor, this.level));
                this.bosses.push(new BossEnemy(340 - 32, 140, this.stage, factor, this.level));
            } else {
                this.bosses.push(new BossEnemy(240 - 32, 120, this.stage, factor, this.level));
            }
        } else {
            if (this.stage >= 3) {
                this.bosses.push(new BossEnemy(140 - 32, 120, this.stage, factor, this.level));
                this.bosses.push(new BossEnemy(340 - 32, 140, this.stage, factor, this.level));
            } else {
                this.bosses.push(new BossEnemy(240 - 32, 120, this.stage, factor, this.level));
            }
        }
    }

    resetGame() {
        scores.reset(); this.life = GAME_CONFIG.PLAYER_INITIAL_LIFE; this.stage = 1;
        this.bullets = []; this.enemyBullets = []; this.items = []; this.particles = []; this.luckyMeteors = [];
        this.playerRespawnTimer = 0; this.stageClearTimer = 0; this.stageType = 'NORMAL';
        this.bossSpawned = false; this.bonusTimer = 0; this.bonusPerfect = false;
        this.bossTimer = 0; this.bossFled = false;
        this.odItemCooldownTimer = 0; this.flashOverlayTimer = 0;
        this.player.reset();
        
        this.player.powerStock = 0;
        this.player.speedStock = 0;

        this.spawnStageElements();
        this.isTouching = false; this.touchDx = 0;
    }

    nextStage() {
        this.stage++; this.bullets = []; this.enemyBullets = []; this.bosses = []; this.enemies = []; this.luckyMeteors = [];
        this.spawnStageElements();
        if (this.player.invulnerableTimer > 0) { this.player.invulnerableTimer += 90; } 
        else { this.player.invulnerableTimer = 90; }
        sound.startBGM();
    }

    bindEvents() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Esc') {
                e.preventDefault();
                this.togglePause();
                return;
            }
            if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
            this.keys[e.code] = true; this.keys[e.key] = true;
            if ((e.code === 'KeyR' || e.key === 'r' || e.key === 'R') && this.state === 'PLAYING') this.triggerReset();
            if (e.code === 'Space' && this.state === 'PLAYING') this.firePlayerBullet();
        });
        document.addEventListener('keyup', (e) => { this.keys[e.code] = false; this.keys[e.key] = false; });

        const getCanvasTouchX = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            return (e.touches[0].clientX - rect.left) * (480 / rect.width);
        };
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            this.isTouchDevice = true; 
            if (this.state !== 'PLAYING') return;
            sound.init(); this.isTouching = true; this.lastTouchX = getCanvasTouchX(e); this.touchDx = 0;
            this.firePlayerBullet(); this.autoShotTimer = 0;
        });
        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); if (!this.isTouching || this.state !== 'PLAYING') return;
            const currentX = getCanvasTouchX(e); this.touchDx = (currentX - this.lastTouchX) * 1.3; this.lastTouchX = currentX;
        });
        this.canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.isTouching = false; this.touchDx = 0; });

        const setLevel = (lvl) => {
            this.level = lvl;
            ['easy', 'normal', 'hard'].forEach(id => document.getElementById(`lvl-${id}`).classList.remove('active'));
            document.getElementById(`lvl-${lvl.toLowerCase()}`).classList.add('active');
            sound.init(); sound.playTone(440, 'sine', 0.08, 0.1);
        };
        document.getElementById('lvl-easy').addEventListener('click', () => setLevel('EASY'));
        document.getElementById('lvl-normal').addEventListener('click', () => setLevel('NORMAL'));
        document.getElementById('lvl-hard').addEventListener('click', () => setLevel('HARD'));
        document.getElementById('start-game-btn').addEventListener('click', () => {
            sound.init(); if (this.state === 'TITLE') { sound.playStartJingle(); this.startGame(); }
        });
        
        document.getElementById('touch-pause-btn').addEventListener('touchstart', (e) => { e.preventDefault(); this.togglePause(); });
        document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('reset-btn').addEventListener('click', () => this.triggerReset());
        document.getElementById('to-title-btn').addEventListener('click', () => this.backToTitle());
        document.getElementById('retry-btn').addEventListener('click', () => this.startGame());
        document.getElementById('go-title-btn').addEventListener('click', () => this.backToTitle());
        document.getElementById('submit-score-btn').addEventListener('click', () => {
            const name = document.getElementById('player-name').value; scores.saveRanking(name);
            document.getElementById('name-input-container').classList.add('hidden'); this.updateLeaderboards();
        });
    }

    togglePause() {
        if (this.state === 'PLAYING') { this.state = 'PAUSED'; sound.stopBGM(); document.getElementById('pause-screen').classList.remove('hidden'); }
        else if (this.state === 'PAUSED') { this.state = 'PLAYING'; sound.startBGM(); document.getElementById('pause-screen').classList.add('hidden'); this.isTouching = false; this.touchDx = 0; }
    }
    triggerReset() { if (confirm("ゲームをリセットして最初から開始しますか？")) { document.getElementById('pause-screen').classList.add('hidden'); this.startGame(); } }
    backToTitle() { this.state = 'TITLE'; sound.stopBGM(); document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('gameover-screen').classList.add('hidden'); document.getElementById('title-screen').classList.remove('hidden'); this.updateLeaderboards(); }
    startGame() { this.state = 'PLAYING'; document.getElementById('title-screen').classList.add('hidden'); document.getElementById('gameover-screen').classList.add('hidden'); this.resetGame(); setTimeout(() => { if(this.state === 'PLAYING') sound.startBGM(); }, 600); }
    updateLeaderboards() { const createRows = (list) => list.map((entry, idx) => `<tr><td>${idx+1}</td><td>${entry.name}</td><td>${entry.score}</td></tr>`).join(''); document.getElementById('leaderboard-body-title').innerHTML = createRows(scores.ranking); }

    firePlayerBullet() {
        if (!this.player.visible || this.stageClearTimer > 0) return;
        const p = this.player;

        if (p.odTimer > 0) {
            sound.playODShot();
            const count = 10;
            for(let i=0; i<count; i++) {
                const angle = -Math.PI / 2 + (i - (count-1)/2) * 0.18;
                const speed = 15;
                this.bullets.push(new Bullet(p.x + p.width/2 - 2, p.y, Math.cos(angle)*speed, Math.sin(angle)*speed, false, false, true));
            }
            return;
        }

        const currentLasers = this.bullets.filter(b => b.isLaser).length;
        const currentNormals = this.bullets.filter(b => !b.isLaser).length;

        if (p.powerLevel === GAME_CONFIG.PLAYER_MAX_POWER - 1) { 
            if (currentLasers >= 2) return;
            sound.playLaser();
            this.bullets.push(new Bullet(p.x + p.width / 2 - 6, p.y - 20, 0, -16, true, false));
        } else {
            let maxShotsAllowed = (p.powerLevel === 2) ? 2 : ((p.powerLevel === 3) ? 3 : ((p.powerLevel === GAME_CONFIG.PLAYER_MAX_POWER) ? 5 : 1));
            if (currentNormals >= maxShotsAllowed * 5) return;
            
            sound.playShot();
            if (p.powerLevel === 1) { 
                this.bullets.push(new Bullet(p.x + p.width / 2 - 2, p.y, 0, -10, false, false)); 
            } else if (p.powerLevel === 2) { 
                this.bullets.push(new Bullet(p.x + 2, p.y, 0, -10, false, false)); 
                this.bullets.push(new Bullet(p.x + p.width - 6, p.y, 0, -10, false, false)); 
            } else if (p.powerLevel === 3) { 
                this.bullets.push(new Bullet(p.x + p.width / 2 - 2, p.y, 0, -10, false, false)); 
                this.bullets.push(new Bullet(p.x, p.y + 6, -2, -10, false, false)); 
                this.bullets.push(new Bullet(p.x + p.width - 4, p.y + 6, 2, -10, false, false)); 
            } else { 
                this.bullets.push(new Bullet(p.x + 4, p.y, 0, -11, false, false)); 
                this.bullets.push(new Bullet(p.x + p.width - 8, p.y, 0, -11, false, false)); 
                this.bullets.push(new Bullet(p.x + 2, p.y + 4, -2, -10, false, false)); 
                this.bullets.push(new Bullet(p.x + p.width - 6, p.y + 4, 2, -10, false, false)); 
                this.bullets.push(new Bullet(p.x + p.width / 2 - 2, p.y - 4, 0, -12, false, false)); 
            }
        }
    }

    enemyFire() {
        if (this.safetyStartTimer > 0 || this.stageClearTimer > 0 || this.stageType === 'BONUS' || this.bossFled) return; 
        let fireChance = 0.012 + (this.stage * 0.0012);
        if (this.level === 'EASY') fireChance *= 0.6;
        if (this.level === 'HARD') fireChance *= 1.4;

        this.bosses.forEach(b => {
            let bossFireThreshold = (this.level === 'HARD' ? 0.05 : (this.level === 'EASY' ? 0.025 : 0.032));
            if (b.active && b.y > 0 && !b.isFleeing && Math.random() < bossFireThreshold) {
                const angle = Math.sin(this.globalTimer * 0.05) * 0.4;
                let bSpeed = this.level === 'HARD' ? 5.5 : (this.level === 'EASY' ? 3.8 : 4.5);
                this.enemyBullets.push(new Bullet(b.x + b.width/2, b.y + b.height, Math.sin(angle)*3, bSpeed, false, true));
                this.enemyBullets.push(new Bullet(b.x + b.width/2, b.y + b.height, Math.sin(angle - 0.25)*3, bSpeed, false, true));
                this.enemyBullets.push(new Bullet(b.x + b.width/2, b.y + b.height, Math.sin(angle + 0.25)*3, bSpeed, false, true));
            }
        });

        if (this.enemies.length > 0 && Math.random() < fireChance) {
            const randomEnemy = this.enemies[Math.floor(Math.random() * this.enemies.length)];
            if (randomEnemy.y > 0 && randomEnemy.state !== 'returning' && !randomEnemy.isOftomo) { 
                if (this.stage >= 3 && randomEnemy.type === 2 && randomEnemy.shotCooldown === 0) {
                    let threeWayChance = 0.20; 
                    if (this.level === 'EASY') threeWayChance = 0.05; 
                    if (this.level === 'HARD') threeWayChance = 0.50; 

                    if (Math.random() < threeWayChance) {
                        const ex = randomEnemy.x + randomEnemy.width / 2;
                        const ey = randomEnemy.y + randomEnemy.height;
                        const dx = (this.player.x + this.player.width / 2) - ex;
                        const dy = (this.player.y + this.player.height / 2) - ey;
                        const angle = Math.atan2(dy, dx);
                        const speed = 3.0 + this.stage * 0.08;

                        this.enemyBullets.push(new Bullet(ex, ey, Math.cos(angle) * speed, Math.sin(angle) * speed, false, true));
                        this.enemyBullets.push(new Bullet(ex, ey, Math.cos(angle - 0.23) * speed, Math.sin(angle - 0.23) * speed, false, true));
                        this.enemyBullets.push(new Bullet(ex, ey, Math.cos(angle + 0.23) * speed, Math.sin(angle + 0.23) * speed, false, true));
                        randomEnemy.shotCooldown = 150;
                    } else {
                        this.enemyBullets.push(new Bullet(randomEnemy.x + randomEnemy.width / 2, randomEnemy.y + randomEnemy.height, 0, 3.8 + this.stage * 0.1, false, true));
                        randomEnemy.shotCooldown = 45; 
                    }
                } else if (randomEnemy.shotCooldown === 0) {
                    this.enemyBullets.push(new Bullet(randomEnemy.x + randomEnemy.width / 2, randomEnemy.y + randomEnemy.height, 0, 3.8 + this.stage * 0.1, false, true)); 
                    randomEnemy.shotCooldown = 45;
                }
            }
        }
    }

    spawnBossOftomo() {
        if (this.stageType !== 'BOSS' || this.bosses.length === 0 || this.stageClearTimer > 0 || this.bossFled) return;
        let spawnInterval = 160; 
        let maxOftomoCount = 2;   
        if (this.level === 'EASY') { spawnInterval = 200; maxOftomoCount = 1; } 
        if (this.level === 'HARD') { spawnInterval = 80; maxOftomoCount = 6; }

        const currentOftomo = this.enemies.filter(e => e.isOftomo).length;
        if (this.globalTimer % spawnInterval === 0 && currentOftomo < maxOftomoCount) {
            const spawnX = 40 + Math.random() * 400;
            this.enemies.push(new Enemy(spawnX, -20, 1, this.stage, this.getLevelFactor(), false, true));
        }
    }

    createExplosion(x, y, count = 12, customColor = null) { 
        sound.playExplode(); 
        for (let i = 0; i < count; i++) { this.particles.push(new Particle(x, y, customColor)); } 
    }

    createBossExplosion(bx, by) {
        sound.playBossExplode(); this.screenShake = 30;
        const colors = ['#9900ff', '#ff0055', '#00ffff', '#ffff00'];
        for (let ring = 0; ring < 3; ring++) {
            const particleCount = 16 + (ring * 8); const baseSpeed = 2 + ring * 1.5; const ringColor = colors[ring % colors.length];
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                this.particles.push(new Particle(bx, by, ringColor, Math.cos(angle) * baseSpeed, Math.sin(angle) * baseSpeed));
            }
        }
    }

    createODSpawnVisual(x, y) {
        sound.playODSpawn();
        this.screenShake = 15;
        this.flashOverlayTimer = 10; 
        
        const odColors = ['#ffff00', '#ff00ff', '#00ffff'];
        for (let i = 0; i < 35; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 10 + Math.random() * 40;
            const px = x + Math.cos(angle) * dist;
            const py = y + Math.sin(angle) * dist;
            const vx = -Math.cos(angle) * (2.0 + Math.random() * 3);
            const vy = -Math.sin(angle) * (2.0 + Math.random() * 3);
            this.particles.push(new Particle(px, py, odColors[i % 3], vx, vy));
        }
    }

    checkCollisions() {
        if (!this.player.visible) return;

        for (let b of this.bullets) {
            if (!b.active) continue;

            for (let m of this.luckyMeteors) {
                if (!m.active) continue;
                if (this.collides(b, m)) {
                    m.active = false;
                    this.createExplosion(m.x + m.width/2, m.y + m.height/2, 30, '#ff00ff');
                    scores.addScore(m.scoreValue);
                    this.life++; sound.play1UP();
                    if (!b.isLaser) b.active = false;
                    break;
                }
            }
            if (!b.active) continue;

            for (let boss of this.bosses) {
                if (!boss.active || boss.y < 0 || boss.isFleeing) continue; 
                if (this.collides(b, boss)) {
                    boss.hp -= (this.player.odTimer > 0 ? 2 : 1); 
                    boss.hurtTimer = 4;
                    if (!b.isLaser) b.active = false;
                    if (boss.hp <= 0) {
                        boss.active = false; this.createBossExplosion(boss.x + boss.width/2, boss.y + boss.height/2);
                        scores.addScore(boss.scoreValue);
                    }
                    if (!b.isLaser) break;
                }
            }

            for (let e of this.enemies) {
                if (!e.active) continue;
                if (this.collides(b, e)) {
                    e.active = false; this.createExplosion(e.x + e.width / 2, e.y + e.height / 2);
                    scores.addScore(e.scoreValue);

                    if (this.stageType === 'BONUS' && !e.isBonusChild) {
                        if (Math.random() < 0.6) {
                            this.enemies.push(new Enemy(e.x, e.y, 1, this.stage, this.getLevelFactor(), true, false, true));
                        }
                    }

                    let odSpawned = false;
                    if (this.stageType !== 'BONUS' && this.player.powerLevel === GAME_CONFIG.PLAYER_MAX_POWER && this.player.speed === GAME_CONFIG.PLAYER_MAX_SPEED) {
                        if (this.odItemCooldownTimer <= 0) {
                            if (Math.random() <= GAME_CONFIG.OD_ITEM_DROP_CHANCE) {
                                const targetSpawnX = 30 + Math.random() * (480 - 60);
                                const targetSpawnY = 520 + Math.random() * 30; 
                                
                                this.createODSpawnVisual(targetSpawnX + 11, targetSpawnY + 11);
                                this.items.push(new Item(targetSpawnX, targetSpawnY, 'O'));
                                odSpawned = true;
                            }
                        }
                    }

                    if (!odSpawned) {
                        let dropChance = e.isBonus ? GAME_CONFIG.BONUS_ENEMY_DROP_CHANCE : GAME_CONFIG.ENEMY_BASE_DROP_CHANCE; 
                        if (e.isOftomo && this.level === 'EASY') dropChance = 0.35;
                        
                        if (Math.random() <= dropChance) { 
                            const testItem = new Item(e.x, e.y, null);
                            this.items.push(testItem);
                            sound.playItemSpawn();
                        }
                    }

                    if (!b.isLaser) { b.active = false; break; }
                }
            }
        }

        if (this.player.invulnerableTimer === 0 && this.stageClearTimer === 0) {
            for (let eb of this.enemyBullets) { if (eb.active && this.collides(eb, this.player)) { eb.active = false; this.handlePlayerHit(); break; } }
            for (let e of this.enemies) { 
                if (e.active && e.y >= 0 && this.collides(e, this.player)) { 
                    if (this.stageType === 'BONUS') {
                        e.active = false; this.createExplosion(e.x + e.width/2, e.y + e.height/2);
                    } else {
                        e.active = false; this.createExplosion(e.x + e.width/2, e.y + e.height/2); this.handlePlayerHit(); 
                    }
                    break; 
                } 
            }
            for (let boss of this.bosses) { if (boss.active && !boss.isFleeing && this.collides(boss, this.player)) { this.handlePlayerHit(); break; } }
        }

        for (let item of this.items) {
            if (item.active && this.collides(item, this.player)) {
                item.active = false; 
                
                if (item.type === 'O') {
                    sound.playODActivate();
                    scores.addScore(3000); 
                    this.player.odTimer = GAME_CONFIG.OD_DURATION; 
                    this.screenShake = 20;
                    for(let i=0; i<30; i++) {
                        this.particles.push(new Particle(this.player.x + 12, this.player.y + 12, '#ffff00'));
                    }

                    const minFrames = GAME_CONFIG.OD_MIN_COOLDOWN_SEC * 60;
                    const maxFrames = GAME_CONFIG.OD_MAX_COOLDOWN_SEC * 60;
                    this.odItemCooldownTimer = Math.floor(minFrames + Math.random() * (maxFrames - minFrames));
                } else {
                    sound.playItemGet(); scores.addScore(500);
                    
                    if (item.type === 'P') {
                        if (this.player.powerLevel < GAME_CONFIG.PLAYER_MAX_POWER) { 
                            this.player.powerLevel++; 
                        } else if (this.isStockUnlocked()) {
                            if (this.player.powerStock < GAME_CONFIG.STOCK_MAX_LIMIT) {
                                this.player.powerStock++;
                            }
                        }
                    }
                    else if (item.type === 'S') {
                        if (this.player.speed < GAME_CONFIG.PLAYER_MAX_SPEED) { 
                            this.player.speed += 1; 
                        } else if (this.isStockUnlocked()) {
                            if (this.player.speedStock < GAME_CONFIG.STOCK_MAX_LIMIT) {
                                this.player.speedStock++;
                            }
                        }
                    }
                    else if (item.type === 'B') { 
                        this.player.invulnerableTimer += 300; 
                        if (this.player.invulnerableTimer > 1500){
                            this.player.invulnerableTimer = 1500;
                        }
                    }
                }
            }
        }

        this.bullets = this.bullets.filter(b => b.active); 
        this.enemyBullets = this.enemyBullets.filter(b => b.active);
        this.enemies = this.enemies.filter(e => e.active); 
        this.bosses = this.bosses.filter(b => b.active); 
        this.items = this.items.filter(i => i.active);
        this.luckyMeteors = this.luckyMeteors.filter(m => m.active);

        if (this.state === 'PLAYING' && this.stageClearTimer === 0) {
            if (this.stageType === 'BOSS') {
                if (this.bossSpawned && this.bosses.length === 0 && !this.bossFled) { 
                    this.enemies = []; this.triggerStageClear(); 
                }
            } else if (this.stageType === 'BONUS') {
                if (this.enemies.length === 0 && this.bonusTimer > 0) {
                    this.bonusPerfect = true; scores.addScore(5000); this.triggerStageClear();
                }
            } else {
                if (this.enemies.filter(e => !e.isOftomo).length === 0) { this.triggerStageClear(); }
            }
        }
    }

    triggerStageClear() { this.stageClearTimer = 120; sound.stopBGM(); if(!this.bossFled) sound.playClearJingle(); }

    handlePlayerHit() {
        sound.playPlayerDamage(); this.createExplosion(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, 25);
        this.life--; 
        this.player.visible = false;
        if (this.life <= 0) { this.gameOver(); } else { this.playerRespawnTimer = 30; }
    }
    gameOver() { this.state = 'GAMEOVER'; sound.stopBGM(); sound.playGameOverJingle(); document.getElementById('gameover-screen').classList.remove('hidden'); document.getElementById('final-score-text').innerText = `SCORE: ${scores.score}`; if (scores.checkRankingEligibility()) { document.getElementById('name-input-container').classList.remove('hidden'); } else { document.getElementById('name-input-container').classList.add('hidden'); } }

    collides(rect1, rect2) { return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y; }

    update() {
        this.globalTimer++; if (this.screenShake > 0) this.screenShake--;
        for (let star of this.stars) { star.y += star.speed; if (star.y > 640) { star.y = 0; star.x = Math.random() * 480; } }
        if (this.state !== 'PLAYING') return;

        this.safetyStartTimer--;
        if (this.odItemCooldownTimer > 0) this.odItemCooldownTimer--;
        if (this.flashOverlayTimer > 0) this.flashOverlayTimer--;

        if (this.luckyMeteorSpawnFrame > 0 && this.globalTimer === this.luckyMeteorSpawnFrame) {
            this.luckyMeteors.push(new LuckyMeteor()); this.luckyMeteorSpawnFrame = -1; 
        }

        if (this.stageType === 'BONUS' && this.stageClearTimer === 0) {
            if (this.bonusTimer > 0) {
                this.bonusTimer--;
                if (this.bonusTimer === 0) { this.enemies = []; this.bonusPerfect = false; this.triggerStageClear(); }
            }
        }

        if (this.stageType === 'BOSS' && this.stageClearTimer === 0 && !this.bossFled) {
            if (this.bossTimer > 0) {
                this.bossTimer--;
                if (this.bossTimer === 0) {
                    this.bossFled = true; this.enemies = []; this.enemyBullets = []; sound.stopBGM(); sound.playBossFlee();
                    this.bosses.forEach(b => b.isFleeing = true); 
                }
            }
        }

        if (this.bossFled && this.stageClearTimer === 0) { if (this.bosses.length === 0) { this.triggerStageClear(); } }
        if (this.stageClearTimer > 0) { this.stageClearTimer--; if (this.stageClearTimer === 0) { this.nextStage(); } }

        if (!this.player.visible && this.playerRespawnTimer > 0) {
            this.playerRespawnTimer--; if (this.playerRespawnTimer === 0) { this.player.reset(); this.safetyStartTimer = 60; }
        }

        if (this.isTouching && this.player.visible && this.stageClearTimer === 0) {
            let shootInterval = this.player.odTimer > 0 ? 4 : 8;
            this.autoShotTimer++; 
            if (this.autoShotTimer >= shootInterval) { this.firePlayerBullet(); this.autoShotTimer = 0; }
        }

        this.player.update(this.keys, this.touchDx); this.touchDx = 0; 
        this.bullets.forEach(b => b.update()); this.enemyBullets.forEach(eb => eb.update());
        this.bosses.forEach(b => b.update()); this.enemies.forEach(e => e.update());
        this.items.forEach(i => i.update()); this.luckyMeteors.forEach(m => m.update()); 
        this.particles.forEach(p => p.update()); this.particles = this.particles.filter(p => p.life > 0);

        this.spawnBossOftomo(); this.enemyFire(); this.checkCollisions();
    }

    draw() {
        this.ctx.save();
        if (this.screenShake > 0) { this.ctx.translate((Math.random() - 0.5) * this.screenShake, (Math.random() - 0.5) * this.screenShake); }
        this.ctx.fillStyle = '#000000'; this.ctx.fillRect(0, 0, 480, 640);
        this.ctx.fillStyle = '#ffffff'; for (let star of this.stars) { this.ctx.fillRect(star.x, star.y, star.size, star.size); }

        this.particles.forEach(p => p.draw(this.ctx)); this.items.forEach(i => i.draw(this.ctx, this.globalTimer));
        this.luckyMeteors.forEach(m => m.draw(this.ctx, this.globalTimer)); 
        this.bullets.forEach(b => b.draw(this.ctx)); this.enemyBullets.forEach(eb => eb.draw(this.ctx));
        this.bosses.forEach(b => b.draw(this.ctx)); this.enemies.forEach(e => { if (e.y >= -10) e.draw(this.ctx); });
        if (this.state === 'PLAYING' || this.state === 'PAUSED' || this.state === 'GAMEOVER') { this.player.draw(this.ctx, this.globalTimer); }
        this.ctx.restore();
        
        if (this.flashOverlayTimer > 0) {
            this.ctx.save();
            this.ctx.fillStyle = `rgba(0, 255, 255, ${this.flashOverlayTimer * 0.04})`;
            this.ctx.fillRect(0, 0, 480, 640);
            this.ctx.restore();
        }

        this.drawHUD();

        if (this.stageClearTimer > 0) {
            this.ctx.save(); this.ctx.fillStyle = 'rgba(0,0,0,0.6)'; this.ctx.fillRect(0, 240, 480, 130);
            this.ctx.textAlign = 'center'; this.ctx.shadowBlur = 10;
            if (this.stageType === 'BOSS') {
                if (this.bossFled) {
                    this.ctx.fillStyle = '#ff3300'; this.ctx.shadowColor = '#ff0000'; this.ctx.font = 'bold 24px "Courier New", monospace';
                    this.ctx.fillText(`BOSS FLED...`, 240, 295);
                } else {
                    this.ctx.fillStyle = '#ffff00'; this.ctx.shadowColor = '#ff5500'; this.ctx.font = 'bold 24px "Courier New", monospace';
                    this.ctx.fillText(`BOSS SECTOR CLEAR!`, 240, 295);
                }
            } else if (this.stageType === 'BONUS') {
                this.ctx.font = 'bold 24px "Courier New", monospace';
                if (this.bonusPerfect) {
                    this.ctx.fillStyle = '#ffff00'; this.ctx.shadowColor = '#ff5500'; this.ctx.fillText(`BONUS PERFECT!`, 240, 295);
                } else {
                    this.ctx.fillStyle = '#ff3300'; this.ctx.shadowColor = '#ff0000'; this.ctx.fillText(`BONUS TIME UP`, 240, 295);
                }
            } else {
                this.ctx.fillStyle = '#ffff00'; this.ctx.shadowColor = '#ff5500'; this.ctx.font = 'bold 24px "Courier New", monospace';
                this.ctx.fillText(`STAGE ${this.stage} CLEAR!`, 240, 295);
            }
            this.ctx.fillStyle = '#00ffff'; this.ctx.font = '14px "Courier New", monospace';
            this.ctx.fillText(`PREPARING FOR NEXT AREA...`, 240, 350); this.ctx.restore();
        }
    }

    drawHUD() {
        this.ctx.save();
        this.ctx.font = 'bold 15px "Courier New", monospace';
        
        // 📊 スコア
        this.ctx.fillStyle = '#ff00ff'; this.ctx.fillText("SCORE", 24, 22);
        this.ctx.fillStyle = '#ffffff'; this.ctx.fillText(String(scores.score).padStart(6, '0'), 20, 42);
        
        // 📊 ハイスコア
        this.ctx.fillStyle = '#00ffff'; this.ctx.fillText("HI-SCORE", 112, 22);
        this.ctx.fillStyle = '#ffffff'; this.ctx.fillText(String(scores.highScore).padStart(6, '0'), 122, 42);
        
        // 📊 PWR（パワー）＆ 貯金数
        let isPMax = this.player.powerLevel === GAME_CONFIG.PLAYER_MAX_POWER; 
        this.ctx.fillStyle = isPMax ? '#ffaa00' : '#00ff66'; 
        this.ctx.fillText("PWR", 224, 22);
        this.ctx.fillStyle = '#ffffff';
        let pText = isPMax ? "MAX" : `Lv${this.player.powerLevel}`;
        this.ctx.fillText(pText, 224, 42);
        // 貯金数（重なり防止のためサイズを小さくし、Lv表示の下に被らない位置に調整）
        if (isPMax && this.player.powerStock > 0) {
            this.ctx.fillStyle = '#ffff00'; this.ctx.font = 'bold 12px "Courier New", monospace';
            this.ctx.fillText(`(+${this.player.powerStock})`, 224 + this.ctx.measureText(pText).width + 6, 41);
        }

        // 📊 SPD（スピード）＆ 貯金数
        this.ctx.font = 'bold 15px "Courier New", monospace';
        let isSMax = this.player.speed === GAME_CONFIG.PLAYER_MAX_SPEED; 
        this.ctx.fillStyle = isSMax ? '#ffaa00' : '#00ffcc'; 
        this.ctx.fillText("SPD", 295, 22);
        this.ctx.fillStyle = '#ffffff';
        let spdLevel = this.player.speed - (GAME_CONFIG.PLAYER_INITIAL_SPEED - 1);
        let sText = isSMax ? "MAX" : `Lv${spdLevel}`;
        this.ctx.fillText(sText, 295, 42);
        // 貯金数
        if (isSMax && this.player.speedStock > 0) {
            this.ctx.fillStyle = '#ffff00'; this.ctx.font = 'bold 12px "Courier New", monospace';
            this.ctx.fillText(`(+${this.player.speedStock})`, 295 + this.ctx.measureText(sText).width + 6, 41);
        }

        // 📊 STG（ステージ数）
        this.ctx.font = 'bold 15px "Courier New", monospace';
        let label = "STG";
        if (this.stageType === 'BOSS') { this.ctx.fillStyle = '#ff0055'; label = "BSS"; }
        else if (this.stageType === 'BONUS') { this.ctx.fillStyle = '#ffff00'; label = "BNS"; }
        else { this.ctx.fillStyle = '#ffea00'; }
        this.ctx.fillText(label, 365, 22);
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillText(String(this.stage).padStart(2, '0'), 370, 42);

        // 🛸 LIFE（残機数表示：常時★×n形式、見切れ完全防止）
        this.ctx.fillStyle = '#ff0055'; this.ctx.fillText("LIFE", 422, 22);
        this.ctx.fillStyle = '#ffff00';
        this.ctx.fillText(`★×${Math.max(0, this.life)}`, 422, 42);
        this.ctx.restore();
        
        // ⚡ オーバードライブゲージ
        if (this.player.odTimer > 0 && this.stageClearTimer === 0) {
            this.ctx.save();
            this.ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
            this.ctx.fillRect(120, 65, 240, 16);
            const hue = (this.globalTimer * 5) % 360;
            this.ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            this.ctx.fillRect(120, 65, 240 * (this.player.odTimer / GAME_CONFIG.OD_DURATION), 16);
            this.ctx.strokeStyle = '#ffffff'; this.ctx.lineWidth = 1;
            this.ctx.strokeRect(120, 65, 240, 16);
            
            this.ctx.fillStyle = '#ffffff'; this.ctx.font = 'bold 11px monospace';
            this.ctx.textAlign = 'center';
            this.ctx.fillText("OVERDRIVE LIMIT", 240, 77);
            this.ctx.restore();
        }

        // 各種ステージ制限時間
        if (this.stageType === 'BONUS' && this.stageClearTimer === 0) {
            this.ctx.save(); this.ctx.textAlign = 'center';
            this.ctx.fillStyle = this.bonusTimer < 180 ? '#ff0055' : '#ffff00'; 
            this.ctx.font = 'bold 16px "Courier New", monospace';
            let secondsLeft = (this.bonusTimer / 60).toFixed(1);
            this.ctx.fillText(`TIME: ${secondsLeft}s`, 240, 95); this.ctx.restore();
        }
        if (this.stageType === 'BOSS' && this.stageClearTimer === 0 && !this.bossFled) {
            this.ctx.save(); this.ctx.textAlign = 'center';
            this.ctx.fillStyle = this.bossTimer < 300 ? '#ff0055' : '#ff00ff'; 
            this.ctx.font = 'bold 16px "Courier New", monospace';
            let secondsLeft = (this.bossTimer / 60).toFixed(1);
            this.ctx.fillText(`LIMIT: ${secondsLeft}s`, 240, 95); this.ctx.restore();
        }
        if (this.safetyStartTimer > 0 && this.state === 'PLAYING') {
            this.ctx.save(); this.ctx.textAlign = 'center'; this.ctx.fillStyle = '#00ffff'; this.ctx.font = 'bold 16px monospace';
            this.ctx.fillText("READY...", 240, 200); this.ctx.restore();
        }

        if (this.isTouchDevice) {
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            this.ctx.fillRect(0, 640 - 60, 480, 60);
            this.ctx.fillStyle = '#666666'; this.ctx.font = '9px monospace'; 
            this.ctx.fillText(`MODE: ${this.level}`, 15, 625);
            this.ctx.save();
            this.ctx.textAlign = 'right';
            this.ctx.fillText(`TOUCH CONTROL ZONE`, 410, 625); 
            this.ctx.restore();
        } else {
            this.ctx.fillStyle = '#444444'; this.ctx.font = '9px monospace'; 
            this.ctx.fillText(`MODE: ${this.level}`, 15, 625);
        }
    }

    loop() { if (this.state === 'PLAYING' || this.state === 'PAUSED' || this.state === 'GAMEOVER') { this.update(); } this.draw(); requestAnimationFrame(() => this.loop()); }
}

window.onload = () => { new Game(); };
</script>
</body>
</html>
